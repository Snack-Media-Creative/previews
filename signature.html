<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <meta name="description" content="A modern glassmorphism email signature built with HTML tables and inline CSS." />
  </head>
    <body style="margin:0; padding:0; display:flex; align-items:center; justify-content:center; min-height:100vh; background:#ffffff;">
<table align="center" cellpadding="10" cellspacing="0" border="0" style="border-collapse:separate; font-family: 'Segoe UI', Arial, sans-serif; max-width:520px;">
  <tr>
    <td style="
        background: linear-gradient(135deg, #0800f4 0%, #0d013c 35%, #000000 70%, #0722ec 100%);
        border-radius: 22px;
        padding: 4px;
      ">
      <table cellpadding="0" cellspacing="0" border="0" style="width:100%;">
        <tr>
          <td style="
              background: rgba(255, 255, 255, 0.22);
              -webkit-backdrop-filter: blur(14px);
              backdrop-filter: blur(14px);
              border-radius: 20px;
              border: 1px solid rgba(255,255,255,0.65);
              box-shadow: inset 0 1px 0 rgba(255,255,255,0.8), 0 8px 24px rgba(80,60,120,0.18);
              padding: 22px 24px;
            ">
            <table cellpadding="0" cellspacing="0" border="0" style="width:100%;">

              <!-- Top row: avatar + name -->
              <tr>
                <td style="width:56px; vertical-align:top;">
                  <table cellpadding="0" cellspacing="0" border="0">
                    <tr>
                      <td style="
                          border-radius: 50%;
                          overflow: hidden;
                        ">
                        <img src="https://ci3.googleusercontent.com/mail-sig/AIorK4xbltH1awolx61retrlHIMxUEa43cAuKU8UqqvjnxpacIFD3Z9bX26qUQz-Od59pAXgAV9VzhxoZPrE" style="width: 60px;">
                      </td>
                    </tr>
                  </table>
                </td>
                <td style="vertical-align:top; padding-left:14px;">
                  <div style="font-size:20px; font-weight:700; color:#fcfcfe; line-height:1.2; text-shadow: 0 1px 1px rgba(255,255,255,0.5);">
                    Felipe
                  </div>
                  <div style="font-size:13px; color:#f8f8fa; margin-top:2px;">
                    Senior Front End Developer &nbsp;•&nbsp; SnackMedia
                  </div>
                </td>
              </tr>

              <tr><td colspan="2" style="height:14px; line-height:14px; font-size:1px;">&nbsp;</td></tr>

              <!-- Frosted contact pill -->
              <tr>
                <td colspan="2">
                  <table cellpadding="0" cellspacing="0" border="0" style="width:100%;">
                    <tr>
                      <td style="
                          background: rgba(255,255,255,0.55);
                          border: 1px solid rgba(255,255,255,0.8);
                          border-radius: 999px;
                          box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 2px 8px rgba(90,70,160,0.12);
                          padding: 10px 18px;
                          font-size: 13px;
                          color: #40405a;
                        ">
                        ✉️&nbsp;&nbsp;felipe@snack-media.com
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>

              <tr><td colspan="2" style="height:14px; line-height:14px; font-size:1px;">&nbsp;</td></tr>

              <!-- Glossy gradient pill buttons -->
              <tr>
                <td colspan="2">
                  <table cellpadding="0" cellspacing="0" border="0">
                    <tr>
                      
                      <td>
                        <a href="https://linkedin.com/in/misha" style="text-decoration:none;">
                          <table cellpadding="0" cellspacing="0" border="0">
                            <tr>
                              <td style="
                                  background: linear-gradient(135deg, #0004ff 0%, #0b013e 100%);
                                  border-radius: 999px;
                                  border: 1px solid rgba(255,255,255,0.4);
                                  box-shadow: inset 0 1px 1px rgba(255,255,255,0.5), 0 4px 10px rgba(56,178,172,0.35);
                                  padding: 9px 20px;
                                  font-size: 12px;
                                  font-weight: 600;
                                  color: #ffffff;
                                ">
                                LinkedIn
                              </td>
                            </tr>
                          </table>
                        </a>
                      </td>
                    </tr>
                  </table>
                </td>
              </tr>

            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
  </body>
</html>
