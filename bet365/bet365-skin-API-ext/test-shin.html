<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    :root {
        --bg-color: #323232;
        --row-border: #444444;
        --text-main: #ffffff;
        --text-muted: #a0a0a0;
        --odds-color: #ffd428;
        --hover-bg: #3c3c3c;
    }
    body {
    color: var(--text-main);
    margin: 0;
    overflow-x: hidden; /* Prevents scrollbars from appearing during the scale animation */
}

/* Pseudo-element handles the background separately from the content */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    
    /* Your original background properties */
    background: #253D34;
    background: linear-gradient(180deg, rgba(37, 61, 52, 1) 0%, rgba(44, 111, 85, 1) 30%, rgba(23, 61, 46, 1) 60%, rgba(49, 146, 107, 1) 86%, rgba(52, 168, 122, 1) 100%);
    background-image: url(img/back.jpg);
    background-size: cover;
    background-position: center;
    
    /* 10-second animation */
    animation: scaleBackground 20s ease-out forwards;
}

/* Keyframes for the 1.5 to 1 scale */
@keyframes scaleBackground {
    0% {
        transform: scale(1.5);
    }
    100% {
        transform: scale(1);
    }
}
    .container {
      display: grid;
      grid-template-columns: 1fr 1000px 1fr;
      width: 100%;
      min-height: 100vh;
    }


    .middle {
      padding: 20px;
    }


    .left, .right {
      display: flex;
      justify-content: space-between; /* Pushes first item to top, last to bottom */
      align-items: center; /* Centers items horizontally */
      flex-direction: column;
      text-align: center;
      height: 100vh; /* Ensures the columns take up the full viewport height */
    }

    .left img, .right img {
        width: 80%;
    }

    .right{
        background-image: url(img/pic_1.png);
        background-position: center;
        background-size: 450px;
        background-repeat: no-repeat;
    }

    /* Force 0 margin and padding on top/bottom containers */
    .top {
        margin: 50px 0 0 0;
        padding: 0;
        width: 100%;
    }
    .bottom {
        margin: 0 0 50px 0;
        padding: 0;
        width: 100%;
    }

    /* Grid for the cards */
        #cards-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            width: 70%;
            margin-bottom: 50px;
            margin: auto;
        }
        
        /* The Card Design */
        .promo-card {
            background: radial-gradient(circle, #25493b 0%, #162d23 100%);
            width: 100%;
            padding: 20px 20px;
            text-align: center;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border-radius: 8px;
            border: 1px solid #2a5242;
        }

        .match-title {
            color: #ffffff;
            font-size: 1.5vh;
            margin-bottom: 5px;
            font-style: normal;
        }

        .match-title .vs {
            color: #6df2a5;
            text-transform: lowercase;
            font-size: 1.5vh;
            margin: 0 8px;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }

        .timer-display {
            color: #6df2a5;
            font-size: 1vh;
            font-family: Arial, sans-serif;
            margin-bottom: 10px; /* Reduced to fit better inside 300px */
            background: rgba(0, 0, 0, 0.3);
            display: inline-block;
            padding: 5px 15px;
            border-radius: 4px;
        }
        .main-market {
            color: #ffffff;
            font-size: 1vh;
            font-weight: 700;
            font-style: italic;
            line-height: 1.1;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        /* The section holding odds and icons */
        .odds-section {
            display: flex;
            justify-content: center; /* Center the group */
            align-items: center; /* Center vertically */
            gap: 5px; /* Space between all elements (odds and icons) */
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 5px;
        }

        /* Specific icon style */
        .odds-icon {
            width: 10px;
            height: 10px;
            object-fit: contain;
            opacity: 0.8;
            filter: drop-shadow(0 0 10px rgba(109, 242, 165, 0.5));
            align-self: flex-end;
            margin-bottom: 5px;
        }

        .odd-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .odd-label {
            color: #9ba6a0;
            font-size: 1vh;
            font-family: Arial, sans-serif;
            font-weight: bold;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .new-odds {
            color: #ffffff;
            font-size: 1.5vh;
            font-weight: 700;
            font-style: italic;
            line-height: 1;
            text-shadow: 0 0 20px rgba(109, 242, 165, 0.4);
        }

        #status {
            color: #ffffff;
            font-size: 20px;
            text-align: center;
            width: 100%;
        }

        .error {
            color: #ff6b6b !important;
        }
    </style>
</head>
<body>
<div class="container">
      <div class="left">
          <div class="top"><img src="img/top.png" alt=""></div>
          <div class="odds-container">
              <div id="status">Fetching Premier League Odds...</div>
              <div id="cards-container"></div>
          </div>
          <div class="bottom"><img src="img/cta.png" alt=""></div>
      </div>
      
      <div class="middle"></div>
      
      <div class="right">
          <div class="top"><img src="img/top.png" alt=""></div>
          <div class="middle-image"></div>
          <div class="bottom"><img src="img/cta.png" alt=""></div>
      </div>
    </div>

    <script>
        const url = 'https://snack-feeds.b-cdn.net/bet365/feeds/premier-league.xml';
        
        const matchLimit = 2; 

        async function fetchAndParseXML() {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                
                const xmlText = await response.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, "text/xml");
                
                document.getElementById('status').style.display = 'none';
                
                generateCards(xmlDoc, matchLimit);
                startTimers();
                
            } catch (error) {
                const statusDiv = document.getElementById('status');
                statusDiv.className = "error";
                statusDiv.innerHTML = `Error loading XML: ${error.message} <br><br>
                <span style="font-size: 14px;">(Check console for CORS errors if running locally.)</span>`;
            }
        }

        function generateCards(xmlDoc, limit) {
            const container = document.getElementById('cards-container');
            const events = xmlDoc.getElementsByTagName("Event"); 
            
            if (events.length === 0) {
                container.innerHTML = "<div style='color: white;'>No events found in the XML feed.</div>";
                return;
            }

            const matchesToDisplay = Math.min(limit, events.length);

            for (let i = 0; i < matchesToDisplay; i++) {
                const eventNode = events[i];
                let eventName = eventNode.getAttribute("Name") || eventNode.getAttribute("name") || "Unknown Event";
                const startTime = eventNode.getAttribute("StartTime");
                
                eventName = eventName.replace(/\s+v\s+/i, ' <span class="vs">v</span> ');
                
                const markets = eventNode.getElementsByTagName("Market");
                
                if (markets.length > 0) {
                    const marketNode = markets[0]; 
                    const marketName = marketNode.getAttribute("Name") || marketNode.getAttribute("name") || "Match Winner";
                    
                    const participants = marketNode.getElementsByTagName("Participant");
                    
                    let homeOdds = "-", drawOdds = "-", awayOdds = "-";
                    let homeFound = false;
                    
                    for (let k = 0; k < participants.length; k++) {
                        const p = participants[k];
                        const pName = p.getAttribute("Name") || p.getAttribute("name") || "";
                        const pOdds = p.getAttribute("Odds") || p.getAttribute("odds") || "-";
                        
                        if (pName.toLowerCase() === "draw" || pName.toLowerCase() === "x") {
                            drawOdds = pOdds;
                        } else if (!homeFound) {
                            homeOdds = pOdds;
                            homeFound = true;
                        } else {
                            awayOdds = pOdds;
                        }
                    }

                    const card = document.createElement('div');
                    card.className = 'promo-card';
                    card.innerHTML = `
                        <div class="match-title">${eventName}</div>
                        <div class="timer-display" data-starttime="${startTime}">Loading timer...</div>
                        <div class="main-market">${marketName}</div>
                        <div class="odds-section">
                            <div class="odd-container">
                                <div class="odd-label">HOME</div>
                                <div class="new-odds">${homeOdds}</div>
                            </div>
                            <img src="arrow.gif" class="odds-icon" /> <!-- Icon between Draw and Away -->
                            <div class="odd-container">
                                <div class="odd-label">DRAW</div>
                                <div class="new-odds">${drawOdds}</div>
                            </div>
                            <img src="arrow.gif" class="odds-icon" /> <!-- Icon between Draw and Away -->
                            <div class="odd-container">
                                <div class="odd-label">AWAY</div>
                                <div class="new-odds">${awayOdds}</div>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                }
            }
        }

        function startTimers() {
            setInterval(() => {
                document.querySelectorAll('.timer-display').forEach(timerEl => {
                    const timeStr = timerEl.getAttribute('data-starttime');
                    if (!timeStr) return;
                    
                    const [datePart, timePart] = timeStr.split(' ');
                    const [day, month, shortYear] = datePart.split('/');
                    const [hour, minute, second] = timePart.split(':');
                    const year = "20" + shortYear; 
                    
                    const eventDate = new Date(`${year}-${month}-${day}T${hour}:${minute}:${second}`);
                    const now = new Date();
                    const diff = eventDate - now;
                    
                    if (diff <= 0) {
                        timerEl.innerText = "Match Started";
                        timerEl.style.color = "#ff6b6b";
                    } else {
                        const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                        const h = Math.floor((diff / (1000 * 60 * 60)) % 24).toString().padStart(2, '0');
                        const m = Math.floor((diff / 1000 / 60) % 60).toString().padStart(2, '0');
                        const s = Math.floor((diff / 1000) % 60).toString().padStart(2, '0');
                        
                        const dayLabel = d === 1 ? 'Day' : 'Days';
                        
                        timerEl.innerText = `${d} ${dayLabel} ${h}:${m}:${s} to kick off`;
                    }
                });
            }, 1000);
        }

        fetchAndParseXML();
    </script>
</body>
</html>
