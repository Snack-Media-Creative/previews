<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
  /* 1. Define a custom angle variable that CSS can animate */
@property --angle {
  syntax: "<angle>";
  initial-value: 0deg;
  inherits: false;
}

.promo-card {
  position: relative;
  width: 320px;
  height: 450px;
  
  background: linear-gradient(135deg, #113626 0%, #06170f 100%);
  border-radius: 16px;
  box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.85);
  box-sizing: border-box;
  
  /* Create a stacking context so pseudo-elements stay behind */
  z-index: 1;
}

/* 2. Apply the rotating gradient to BOTH pseudo-elements */
.promo-card::before, 
.promo-card::after {
  content: "";
  position: absolute;
  inset: -3px;
  border-radius: 19px;
  z-index: -1;
  
  /* Conic gradient sweeps around the center using the animated angle */
  background: conic-gradient(from var(--angle), #071c12 0%, #0e4028 180deg, #2df596 360deg);
  
  /* 4s dictates the speed of the rotation */
  animation: rotate-border 4s linear infinite;
}

/* 3. Turn the ::after element into the outer neon glow */
.promo-card::after {
  filter: blur(15px);
  opacity: 0.6; /* Adjust this value to make the glow stronger or softer */
}

/* 4. Animate the angle from 0 to 360 degrees */
@keyframes rotate-border {
  0% {
    --angle: 0deg;
  }
  100% {
    --angle: 360deg;
  }
}
  </style>
</head>
<body>
  <div class="promo-box">algo</div>
</body>
</html>
