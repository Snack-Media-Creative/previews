<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,700;0,900;1,700;1,900&display=swap');
    :root {
        --bg-color: #323232;
        --row-border: #444444;
        --text-main: #ffffff;
        --text-muted: #a0a0a0;
        --odds-color: #ffd428;
        --hover-bg: #3c3c3c;
    }
    body {
    color: var(--text-main);
    font-family: 'Roboto', sans-serif;
    margin: 0;
    overflow-x: hidden; /* Prevents scrollbars from appearing during the scale animation */
}

/* Pseudo-element handles the background separately from the content */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    
    /* Your original background properties */
    background: #253D34;
    background: linear-gradient(180deg, rgba(37, 61, 52, 1) 0%, rgba(44, 111, 85, 1) 30%, rgba(23, 61, 46, 1) 60%, rgba(49, 146, 107, 1) 86%, rgba(52, 168, 122, 1) 100%);
    background-image: url(img/back.jpg);
    background-size: cover;
    background-position: center;
    
    /* 10-second animation */
    animation: scaleBackground 20s ease-out forwards;
}

/* Keyframes for the 1.5 to 1 scale */
@keyframes scaleBackground {
    0% {
        transform: scale(1.2);
    }
    100% {
        transform: scale(1);
    }
}
    .container {
      display: grid;
      grid-template-columns: 1fr 970px 1fr;
      width: 100%;
      min-height: 100vh;
    }


    .middle {
      padding: 20px;
    }


    .left, .right {
      display: flex;
      justify-content: space-between; /* Pushes first item to top, last to bottom */
      align-items: center; /* Centers items horizontally */
      flex-direction: column;
      text-align: center;
      height: 100vh; /* Ensures the columns take up the full viewport height */
    }

    .left img, .right img {
        width: 80%;
    }

    .left{
        background-image: url(img/playes-pic.png);
        background-position: 50% 75%;
        background-size: 550px;
        background-repeat: no-repeat;
    }

    /* Force 0 margin and padding on top/bottom containers */
    .top {
        margin: 50px 0 0 0;
        padding: 0;
        width: 100%;
    }
    .bottom {
        margin: 0;
        padding: 0;
        width: 100%;
    }

    /* Grid for the cards */
        #cards-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            width: 70%;
            margin-bottom: 50px;
            margin: auto;
        }
        
        /* The Card Design */
        .promo-card {
            background: radial-gradient(circle, #25493b 0%, #162d23 100%);
            width: 100%;
            padding: 20px 20px;
            text-align: center;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border-radius: 8px;
            border: 1px solid #2a5242;
        }
        

        .match-title {
            color: #ffffff;
            font-size: 1.5vh;
            margin-bottom: 5px;
            font-style: normal;
        }

        .match-title .vs {
            color: #6df2a5;
            text-transform: lowercase;
            font-size: 1.5vh;
            margin: 0 8px;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }

        .timer-display {
            color: #6df2a5;
            font-size: 1vh;
            font-family: Arial, sans-serif;
            margin-bottom: 10px; /* Reduced to fit better inside 300px */
            background: rgba(0, 0, 0, 0.3);
            display: inline-block;
            padding: 5px 15px;
            border-radius: 4px;
        }
        .main-market {
            color: #ffffff;
            font-size: 1vh;
            font-weight: 700;
            font-style: italic;
            line-height: 1.1;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        #dashboard {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 280px;
            width: 90%;
            margin:auto;
            align-items:center;
        }

        /* --- Main Card Styling --- */
        .bet-card {
            background: linear-gradient(180deg, #122a27cd 0%, #0d1e1c82 100%);
            border: 1px solid #ffffff;
            border-radius: 12px;
            width: 100%;
            box-shadow: 0 0 15px rgba(93, 228, 156, 1),0 0 0 1px #5de49c,0 0 0 2px #5de49c inset,0 0 15px #5de49c inset;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-content {
            padding: 15px;
            flex-grow: 1;
            text-align: left;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .market-name {
            font-size: 1rem;
            font-weight: 900;
            font-style: italic;
            color: #a7f2e1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 0;
        }

        .odds-container {
            text-align: right;
        }

        .unboosted-odds {
            color: #88a39e;
            font-size: 0.7rem;
            text-decoration: line-through;
            margin-right: 8px;
            font-weight: 700;
        }

        .main-odds {
            font-size: 1rem;
            font-weight: 900;
            color: #f6ca3f;
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
            margin: 5px 0;
            border: none;
        }

        .event-name {
            font-size: 0.8rem;
            font-weight: 900;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .event-name .v {
            color: #5de49c;
            font-size: 0.8em;
            margin: 0px;
            text-transform: lowercase;
            font-weight: 700;
        }

        .selections-list {
            position: relative;
            padding: 0;
            margin: 0;
            list-style: none;
        }

        .selections-list::before {
            content: '';
            position: absolute;
            top: 15px;
            bottom: 10px;
            left: 9px;
            width: 2px;
            background-color: #5de49c;
            z-index: 1;
        }

        .selection-item {
            position: relative;
            display: flex;
            align-items: center;
            margin-bottom: 5px;
            font-size: 0.8rem;
            color: #e0e6e5;
            z-index: 2;
        }

        .selection-item:last-child {
            margin-bottom: 0;
        }

        .check-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #122a27;
            border: 2px solid #5de49c;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
            flex-shrink: 0;
            z-index: 2;
        }

        .check-icon svg {
            width: 12px;
            height: 12px;
            fill: none;
            stroke: #5de49c;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .card-footer {
            background-color: #79efae;
            padding: 5px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #0b1514;
        }

        .footer-col {
            display: flex;
            flex-direction: column;
        }

        .footer-col.right {
            text-align: right;
        }

        .footer-label {
            font-size: 0.8rem;
            margin-bottom: 0px;
            font-weight: 400;
            color: #1a3830;
        }

        .footer-val {
            font-size: 1rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: #000000;
        }

        .loading {
            font-size: 1rem;
            color: #5de49c;
        }

        .error {
            background: #ff4d4d;
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            max-width: 600px;
            line-height: 1.5;
        }
        
        .no-results {
            font-size: 1rem;
            color: #88a39e;
            text-align: center;
            width: 100%;
            margin-top: 20px;
        }
        .oddsName{
            color: #5de49c;
            margin-left: 10px;
            font-weight: bold;
        }
        #main-link{
            position: absolute;
            width:100%;
            height:100vh;
            top:0;
            left:0;
        }
        a {
            text-decoration: none; /* Removes the underline */
            color: inherit;        /* Optional: Removes the default blue color and makes the link match your surrounding text */
        }
    </style>
</head>
<body>
<div class="container">
      <div class="left">
          <div class="top"><img src="img/top-text.png" alt=""></div>
          <div class="middle-image"></div>
          <div class="bottom"><img src="img/footer.png" alt=""></div>
      </div>
      
      <div class="middle"></div>
      
      <div class="right">
          <div class="top"><img src="img/top-text.png" alt=""></div>
          <div class="middle-image"><div id="dashboard"><div class="loading">Loading odds data...</div></div></div>
          <div class="bottom"><img src="img/footer.png" alt=""></div>
      </div>
    </div>

    <script>
        let globalXmlDoc = null;

        // Where a card links to when its market has no betslip URL
        const FALLBACK_URL = 'https://bet365.com/?utm_source=snackmedia';

        function escapeAttr(value) {
            return value.replace(/&/g, '&amp;').replace(/"/g, '&quot;');
        }

        document.addEventListener("DOMContentLoaded", () => {
            const dashboard = document.getElementById('dashboard');

            // Fetches data from the live XML feed
            fetch('https://snack-feeds.b-cdn.net/bet365/feeds/snack-next-bet-builder.xml')
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return response.text();
                })
                .then(xmlString => {
                    const parser = new DOMParser();
                    globalXmlDoc = parser.parseFromString(xmlString, "text/xml");
                    
                    // 'Name of team to filter', leave empty for default maxCards
                    renderDashboard('', 1);
                })
                .catch(error => {
                    console.error('Error fetching or parsing XML:', error);
                    dashboard.innerHTML = `
                        <div class="error">
                            <strong>Failed to load the XML feed.</strong><br>
                            If you are viewing this locally, your browser may be blocking the request due to CORS (Cross-Origin Resource Sharing) restrictions.<br>
                            Error details: ${error.message}
                        </div>
                    `;
                });
        });

        // Function to shuffle an array
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        // Updated function takes a filterText and an optional maxCards limit
        function renderDashboard(filterText, maxCards = 10) {
            const dashboard = document.getElementById('dashboard');
            dashboard.innerHTML = ''; 
            
            if (!globalXmlDoc) return;

            // Get all events
            const events = Array.from(globalXmlDoc.getElementsByTagName('Event'));
            let allMarkets = [];

            // Collect all markets that match the filter
            for (let i = 0; i < events.length; i++) {
                const eventNode = events[i];
                let rawName = eventNode.getAttribute('Name') || '';

                if (filterText !== 'All' && filterText !== '' && !rawName.includes(filterText)) {
                    continue; 
                }

                const markets = eventNode.getElementsByTagName('Market');
                for (let j = 0; j < markets.length; j++) {
                    allMarkets.push({
                        eventNode: eventNode,
                        marketNode: markets[j],
                        rawName: rawName
                    });
                }
            }
            
            // Randomize the order of ALL markets globally
            allMarkets = shuffleArray(allMarkets);

            let cardsRendered = 0;

            for (let i = 0; i < allMarkets.length; i++) {
                if (cardsRendered >= maxCards) break;

                const { eventNode, marketNode, rawName } = allMarkets[i];
                let formattedName = rawName.replace(' v ', ' <span class="v">v</span> ');
                
                const marketName = marketNode.getAttribute('Name');
                const marketUnBoosted = marketNode.getAttribute('UnBoostedOdds');
                const marketOdds = marketNode.getAttribute('Odds');
                const marketOddsDecimal = marketNode.getAttribute('OddsDecimal');
                const betslipUrl = marketNode.getAttribute('betslip') || FALLBACK_URL;
                
                const displayOdds = marketOdds ? marketOdds : '';
                
                let participantsHtml = '';
                const participants = marketNode.getElementsByTagName('Participant');

                let calculatedReturn = "--";
                let oddsForCalculation = marketOddsDecimal; 

                if (participants.length > 0) {
                    for (let k = 0; k < participants.length; k++) {
                        const pName = participants[k].getAttribute('Name');
                        const pOdds = participants[k].getAttribute('Odds');
                        
                        // If marketOddsDecimal is empty/falsy, fallback to the participant's odds
                        if (!oddsForCalculation) {
                            oddsForCalculation = pOdds;
                        }

                        participantsHtml += `
                            <div class="selection-item">
                                <div class="check-icon">
                                    <svg viewBox="0 0 24 24">
                                        <polyline points="20 6 9 17 4 12"></polyline>
                                    </svg>
                                </div>
                                <span>${pName}</span>
                            </div>
                        `;
                    }

                    // Evaluate calculatedReturn now that we have our final oddsForCalculation
                    if (oddsForCalculation) {
                        if (oddsForCalculation.includes('/')) {
                            // Fallback logic in case pOdds represents a fraction (e.g. 5/1)
                            const [num, den] = oddsForCalculation.split('/');
                            const decimalOdds = (parseFloat(num) / parseFloat(den)) + 1;
                            calculatedReturn = (10 * decimalOdds).toFixed(2);
                        } else if (!isNaN(parseFloat(oddsForCalculation))) {
                            const returnVal = 10 * parseFloat(oddsForCalculation);
                            calculatedReturn = returnVal.toFixed(2);
                        }
                    }

                    const cardHtml = `
                    <a id="main-link" href="https://bet365.com/?utm_source=snackmedia" target="_blank" rel="noopener"></a>
                        <a class="bet-card" href="${escapeAttr(betslipUrl)}" target="_blank" rel="noopener">
                            <div class="card-content">
                                <div class="card-header">
                                    <h3 class="market-name"><spam style="color: #ffffff;">BET</spam> BUILDER</h3>
                                    <div class="odds-container">
                                        ${marketUnBoosted ? `<span class="unboosted-odds">${marketUnBoosted}</span>` : ''}
                                        <span class="main-odds">${displayOdds}</span>
                                    </div>
                                </div>
                                <hr class="divider">
                                
                                <div class="event-name">${formattedName}</div>
                                
                                <div class="selections-list">
                                    ${participantsHtml}
                                </div>
                            </div>
                            
                            <div class="card-footer">
                                <div class="footer-col">
                                    <span class="footer-label">Stake</span>
                                    <span class="footer-val">£10.00</span>
                                </div>
                                <div class="footer-col">
                                    <span class="footer-label">To Return</span>
                                    <span class="footer-val">£${calculatedReturn}</span>
                                </div>
                            </div>
                        </a>
                    `;

                    dashboard.innerHTML += cardHtml;
                    cardsRendered++;
                }
            }

            if (cardsRendered === 0) {
                dashboard.innerHTML = `<div class="no-results">No markets found for ${filterText}.</div>`;
            }

            refreshAutoScrollLists();
        }

        // Selections lists that overflow ease to the bottom, hold there, then restart from the top
        const SCROLL_DURATION_MS = 5000;
        const SCROLL_HOLD_MS = 5000;
        let autoScrollLists = [];

        function refreshAutoScrollLists() {
            autoScrollLists = Array.from(document.querySelectorAll('.selections-list'))
                .filter(el => el.scrollHeight > el.clientHeight);
        }

        function autoScrollTick(now) {
            const elapsed = now % (SCROLL_DURATION_MS + SCROLL_HOLD_MS);
            const t = Math.min(elapsed / SCROLL_DURATION_MS, 1);
            const progress = (1 - Math.cos(t * Math.PI)) / 2;
            autoScrollLists.forEach(el => {
                el.scrollTop = progress * (el.scrollHeight - el.clientHeight);
            });
            requestAnimationFrame(autoScrollTick);
        }
        requestAnimationFrame(autoScrollTick);
    </script>
    <script>
        // ADNAMI CLICK TRACKING MACRO - DO NOT MODIFY //
const clickTagPrefix = "${CLICK_URL}",

// Landing Page - modify as required
clickURL = (window.adnmClick) ? window.adnmClick : "https://www.bet365.com/?utm_source=snackmedia",

// ID of your clickable HTML element - modify as required
clickElement = document.getElementById("main-link");

// Click function
clickElement.addEventListener("click", function(e){
    const exitUrl = clickTagPrefix + clickURL;
    window.open(exitUrl, '_blank');
})
    </script>
</body>
</html>
