<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,700;0,900;1,700;1,900&display=swap');
    :root {
        --bg-color: #323232;
        --row-border: #444444;
        --text-main: #ffffff;
        --text-muted: #a0a0a0;
        --odds-color: #ffd428;
        --hover-bg: #3c3c3c;
    }
    body {
    color: var(--text-main);
    font-family: 'Roboto', sans-serif;
    margin: 0;
    overflow-x: hidden; /* Prevents scrollbars from appearing during the scale animation */
}

/* Pseudo-element handles the background separately from the content */
body::before {
    content: "";
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    
    /* Your original background properties */
    background: #253D34;
    background: linear-gradient(180deg, rgba(37, 61, 52, 1) 0%, rgba(44, 111, 85, 1) 30%, rgba(23, 61, 46, 1) 60%, rgba(49, 146, 107, 1) 86%, rgba(52, 168, 122, 1) 100%);
    background-image: url(img/back.jpg);
    background-size: cover;
    background-position: center;
    
    /* 10-second animation */
    animation: scaleBackground 20s ease-out forwards;
}

/* Keyframes for the 1.5 to 1 scale */
@keyframes scaleBackground {
    0% {
        transform: scale(1.2);
    }
    100% {
        transform: scale(1);
    }
}
    .container {
      display: grid;
      grid-template-columns: 1fr 970px 1fr;
      width: 100%;
      min-height: 100vh;
    }


    .middle {
      padding: 20px;
    }


    .left, .right {
      display: flex;
      justify-content: space-between; /* Pushes first item to top, last to bottom */
      align-items: center; /* Centers items horizontally */
      flex-direction: column;
      text-align: center;
      height: 100vh; /* Ensures the columns take up the full viewport height */
    }

    .left img, .right img {
        width: 80%;
    }

    .left{
        background-image: url(img/playes-pic.png);
        background-position: 50% 75%;
        background-size: 550px;
        background-repeat: no-repeat;
    }

    /* Force 0 margin and padding on top/bottom containers */
    .top {
        margin: 50px 0 0 0;
        padding: 0;
        width: 100%;
    }
    .bottom {
        margin: 0;
        padding: 0;
        width: 100%;
    }

    /* Grid for the cards */
        #cards-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            width: 70%;
            margin-bottom: 50px;
            margin: auto;
        }
        
        /* The Card Design */
        .promo-card {
            background: radial-gradient(circle, #25493b 0%, #162d23 100%);
            width: 100%;
            padding: 20px 20px;
            text-align: center;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border-radius: 8px;
            border: 1px solid #2a5242;
        }
        

        .match-title {
            color: #ffffff;
            font-size: 1.5vh;
            margin-bottom: 5px;
            font-style: normal;
        }

        .match-title .vs {
            color: #6df2a5;
            text-transform: lowercase;
            font-size: 1.5vh;
            margin: 0 8px;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }

        .timer-display {
            color: #6df2a5;
            font-size: 1vh;
            font-family: Arial, sans-serif;
            margin-bottom: 10px; /* Reduced to fit better inside 300px */
            background: rgba(0, 0, 0, 0.3);
            display: inline-block;
            padding: 5px 15px;
            border-radius: 4px;
        }
        .main-market {
            color: #ffffff;
            font-size: 1vh;
            font-weight: 700;
            font-style: italic;
            line-height: 1.1;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        #dashboard {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 280px;
            width: 90%;
            margin:auto;
            align-items:center;
        }

        /* --- Main Card Styling --- */
        .bet-card {
            background: linear-gradient(180deg, #122a27cd 0%, #0d1e1c82 100%);
            border: 1px solid #ffffff;
            border-radius: 12px;
            width: 100%;
            box-shadow: 0 0 15px rgba(93, 228, 156, 1),0 0 0 1px #5de49c,0 0 0 2px #5de49c inset,0 0 15px #5de49c inset;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-content {
            padding: 15px;
            flex-grow: 1;
            text-align: left;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .market-name {
            font-size: 1rem;
            font-weight: 900;
            font-style: italic;
            color: #a7f2e1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 0;
        }

        .odds-container {
            text-align: right;
        }

        .unboosted-odds {
            color: #88a39e;
            font-size: 0.7rem;
            text-decoration: line-through;
            margin-right: 8px;
            font-weight: 700;
        }

        .main-odds {
            font-size: 1rem;
            font-weight: 900;
            color: #f6ca3f;
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
            margin: 5px 0;
            border: none;
        }

        .event-name {
            font-size: 0.8rem;
            font-weight: 900;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .event-name .v {
            color: #5de49c;
            font-size: 0.8em;
            margin: 0px;
            text-transform: lowercase;
            font-weight: 700;
        }

        .selections-list {
            position: relative;
            padding: 0;
            margin: 0;
            list-style: none;
        }

        .selections-list::before {
            content: '';
            position: absolute;
            top: 15px;
            bottom: 10px;
            left: 9px;
            width: 2px;
            background-color: #5de49c;
            z-index: 1;
        }

        .selection-item {
            position: relative;
            display: flex;
            align-items: center;
            margin-bottom: 5px;
            font-size: 0.8rem;
            color: #e0e6e5;
            z-index: 2;
        }

        .selection-item:last-child {
            margin-bottom: 0;
        }

        .check-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #122a27;
            border: 2px solid #5de49c;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
            flex-shrink: 0;
            z-index: 2;
        }

        .check-icon svg {
            width: 12px;
            height: 12px;
            fill: none;
            stroke: #5de49c;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .card-footer {
            background-color: #79efae;
            padding: 5px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #0b1514;
        }

        .footer-col {
            display: flex;
            flex-direction: column;
        }

        .footer-col.right {
            text-align: right;
        }

        .footer-label {
            font-size: 0.8rem;
            margin-bottom: 0px;
            font-weight: 400;
            color: #1a3830;
        }

        .footer-val {
            font-size: 1rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: #000000;
        }

        .loading {
            font-size: 1rem;
            color: #5de49c;
        }

        .error {
            background: #ff4d4d;
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            max-width: 600px;
            line-height: 1.5;
        }
        
        .no-results {
            font-size: 1rem;
            color: #88a39e;
            text-align: center;
            width: 100%;
            margin-top: 20px;
        }
        .oddsName{
            color: #5de49c;
            margin-left: 10px;
            font-weight: bold;
        }
        #main-link{
            position: absolute;
            width:100%;
            height:100vh;
            top:0;
            left:0;
        }
        a {
            text-decoration: none; /* Removes the underline */
            color: inherit;        /* Optional: Removes the default blue color and makes the link match your surrounding text */
        }
    </style>
</head>
<body>
<div class="container">
      <div class="left">
          <div class="top"><img src="img/top-text.png" alt=""></div>
          <div class="middle-image"></div>
          <div class="bottom"><img src="img/footer.png" alt=""></div>
      </div>
      
      <div class="middle"></div>
      
      <div class="right">
          <div class="top"><img src="img/top-text.png" alt=""></div>
          <div class="middle-image"><div id="dashboard"><div class="loading">Loading odds data...</div></div></div>
          <div class="bottom"><img src="img/footer.png" alt=""></div>
      </div>
    </div>

    <script src="api.js"></script>
</body>
</html>
