<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bet365 XML Data Viewer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            padding: 20px;
        }
        h1 {
            color: #005555;
        }
        #xml-container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 900px;
            margin: auto;
            overflow-x: auto;
        }
        ul {
            list-style-type: none;
            padding-left: 20px;
            border-left: 1px dashed #ccc;
        }
        li {
            margin: 5px 0;
        }
        .node-name {
            font-weight: bold;
            color: #0078d7;
        }
        .node-value {
            color: #d9534f;
            margin-left: 10px;
        }
        .attribute {
            font-size: 0.9em;
            color: #5cb85c;
            margin-left: 10px;
        }
        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="xml-container">
        <h1>XML Data Feed</h1>
        <div id="loading">Fetching and parsing XML data. Please wait...</div>
        <div id="content"></div>
    </div>

    <script>
        // Configuration: Point to your new local PHP file
const url = 'proxy.php';

// Fetch the XML data from your own server (Bypasses CORS and hides credentials)
fetch(url)
.then(response => {
    if (!response.ok) {
        throw new Error(`HTTP error! Status: ${response.status}`);
    }
    return response.text();
})
.then(str => {
    // Parse the string into an XML Document
    const parser = new DOMParser();
    const xmlDoc = parser.parseFromString(str, "text/xml");

    // Check for parsing errors
    if (xmlDoc.getElementsByTagName("parsererror").length > 0) {
        // If it fails, throw an error showing the first 300 characters of the raw response
        throw new Error("Server did not return XML. Raw response: " + str.substring(0, 300));
    }

    // Remove loading message and render the XML
    document.getElementById('loading').style.display = 'none';
    const contentDiv = document.getElementById('content');
    contentDiv.appendChild(renderXML(xmlDoc.documentElement));
})
.catch(error => {
    document.getElementById('loading').innerHTML = `<span class="error">Failed to load data: ${error.message}</span>`;
    console.error('Error:', error);
});

/**
 * Recursively processes an XML node and returns an HTML element (UL/LI)
 */
function renderXML(node) {
    const ul = document.createElement('ul');
    const li = document.createElement('li');
    
    // 1. Add Element Name
    const nameSpan = document.createElement('span');
    nameSpan.className = 'node-name';
    nameSpan.textContent = `<${node.nodeName}>`;
    li.appendChild(nameSpan);

    // 2. Add Attributes (if any)
    if (node.attributes.length > 0) {
        for (let i = 0; i < node.attributes.length; i++) {
            const attr = node.attributes[i];
            const attrSpan = document.createElement('span');
            attrSpan.className = 'attribute';
            attrSpan.textContent = `[${attr.name}="${attr.value}"]`;
            li.appendChild(attrSpan);
        }
    }

    // 3. Add Text Content or Child Nodes
    let hasChildElements = false;
    
    for (let i = 0; i < node.childNodes.length; i++) {
        const child = node.childNodes[i];
        if (child.nodeType === 1) { // Element Node
            hasChildElements = true;
            li.appendChild(renderXML(child));
        }
    }

    // If no child elements, display the text value
    if (!hasChildElements && node.textContent.trim() !== "") {
        const valSpan = document.createElement('span');
        valSpan.className = 'node-value';
        valSpan.textContent = node.textContent.trim();
        li.appendChild(valSpan);
    }

    ul.appendChild(li);
    return ul;
}
    </script>
</body>
</html>
