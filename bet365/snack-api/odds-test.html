<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boosted Bet Builders</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,700;0,900;1,700;1,900&display=swap');

        body {
            background-color: #0b1514; 
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            color: white;
        }

        h1 {
            color: #5de49c;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0;
        }

        /* --- Filter Styling --- */
        .filter-container {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .filter-container label {
            color: #5de49c;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-container select {
            background: #122a27;
            color: #5de49c;
            border: 2px solid #5de49c;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: 'Roboto', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            outline: none;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(93, 228, 156, 0.1);
        }

        .filter-container select:hover {
            background: #1a3830;
        }

        #dashboard {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            max-width: 1200px;
            width: 100%;
        }

        /* --- Main Card Styling --- */
        .bet-card {
            background: linear-gradient(180deg, #122a27 0%, #0d1e1c 100%);
            border: 2px solid #5de49c;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 0 15px rgba(93, 228, 156, 0.2);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .card-content {
            padding: 25px;
            flex-grow: 1;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .market-name {
            font-size: 1.5rem;
            font-weight: 900;
            font-style: italic;
            color: #a7f2e1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 0;
        }

        .odds-container {
            text-align: right;
        }

        .unboosted-odds {
            color: #88a39e;
            font-size: 0.9rem;
            text-decoration: line-through;
            margin-right: 8px;
            font-weight: 700;
        }

        .main-odds {
            font-size: 1.8rem;
            font-weight: 900;
            color: #f6ca3f;
        }

        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.2);
            margin: 20px 0;
            border: none;
        }

        .event-name {
            font-size: 1.25rem;
            font-weight: 900;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #ffffff;
        }

        .event-name .v {
            color: #5de49c;
            font-size: 0.9em;
            margin: 0 3px;
            text-transform: lowercase;
            font-weight: 700;
        }

        .selections-list {
            position: relative;
            padding: 0;
            margin: 0;
            list-style: none;
        }

        .selections-list::before {
            content: '';
            position: absolute;
            top: 15px;
            bottom: 15px;
            left: 9px;
            width: 2px;
            background-color: #5de49c;
            z-index: 1;
        }

        .selection-item {
            position: relative;
            display: flex;
            align-items: center;
            margin-bottom: 16px;
            font-size: 1.1rem;
            color: #e0e6e5;
            z-index: 2;
        }

        .selection-item:last-child {
            margin-bottom: 0;
        }

        .check-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #122a27;
            border: 2px solid #5de49c;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-right: 15px;
            flex-shrink: 0;
            z-index: 2;
        }

        .check-icon svg {
            width: 12px;
            height: 12px;
            fill: none;
            stroke: #5de49c;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .card-footer {
            background-color: #79efae;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #0b1514;
        }

        .footer-col {
            display: flex;
            flex-direction: column;
        }

        .footer-col.right {
            text-align: right;
        }

        .footer-label {
            font-size: 1rem;
            margin-bottom: 2px;
            font-weight: 400;
            color: #1a3830;
        }

        .footer-val {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: #000000;
        }

        .loading {
            font-size: 1.2rem;
            color: #5de49c;
        }

        .error {
            background: #ff4d4d;
            color: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            max-width: 600px;
        }
        
        .no-results {
            font-size: 1.2rem;
            color: #88a39e;
            text-align: center;
            width: 100%;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h1>Top Markets & Bet Builders</h1>
    
    <div class="filter-container">
        <label for="teamFilter">Filter Games: </label>
        <select id="teamFilter">
            <option value="All">All Games</option>
            <option value="Arsenal">Arsenal Only</option>
            <option value="Brentford">Brentford Only</option>
            <option value="Fulham">Fulham Only</option>
            <option value="Ipswich">Ipswich Only</option>
            <option value="Coventry">Coventry Only</option>
            <option value="Newcastle">Newcastle Only</option>
        </select>
    </div>

    <div id="dashboard"><div class="loading">Loading odds data...</div></div>

    <script>
        let globalXmlDoc = null; // Store the parsed XML data globally

        document.addEventListener("DOMContentLoaded", () => {
            const dashboard = document.getElementById('dashboard');
            const teamFilter = document.getElementById('teamFilter');

            // Listen for dropdown changes
            teamFilter.addEventListener('change', (e) => {
                renderDashboard(e.target.value);
            });

            // Fetch the XML file directly
            fetch('boost.xml')
                .then(response => {
                    if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                    return response.text();
                })
                .then(xmlString => {
                    const parser = new DOMParser();
                    globalXmlDoc = parser.parseFromString(xmlString, "text/xml");
                    
                    // Initial render showing all games
                    renderDashboard('All');
                })
                .catch(error => {
                    console.error('Error fetching or parsing XML:', error);
                    dashboard.innerHTML = `
                        <div class="error">
                            <strong>Failed to load boost.xml</strong><br>
                            Make sure you are running a local web server (e.g., http://localhost) and the file is in the same directory.
                        </div>
                    `;
                });
        });

        // Function to render cards based on the active filter
        function renderDashboard(filterText) {
            const dashboard = document.getElementById('dashboard');
            dashboard.innerHTML = ''; // Clear current dashboard
            
            if (!globalXmlDoc) return;

            const events = globalXmlDoc.getElementsByTagName('Event');
            let cardsRendered = 0;

            for (let i = 0; i < events.length; i++) {
                const eventNode = events[i];
                let rawName = eventNode.getAttribute('Name') || '';

                // Apply the filter logic
                if (filterText !== 'All' && !rawName.includes(filterText)) {
                    continue; // Skip this event if it doesn't match the filter
                }

                let formattedName = rawName.replace(' v ', ' <span class="v">v</span> ');
                const markets = eventNode.getElementsByTagName('Market');
                
                for (let j = 0; j < markets.length; j++) {
                    const marketNode = markets[j];
                    const marketName = marketNode.getAttribute('Name');
                    const marketUnBoosted = marketNode.getAttribute('UnBoostedOdds');
                    const marketOdds = marketNode.getAttribute('Odds');
                    const marketOddsDecimal = marketNode.getAttribute('OddsDecimal');
                    
                    const displayOdds = marketOdds ? marketOdds : '';
                    
                    // Calculate Return based on a £10 stake using the OddsDecimal attribute
                    let calculatedReturn = "--";
                    if (marketOddsDecimal && !isNaN(parseFloat(marketOddsDecimal))) {
                        const returnVal = 10 * parseFloat(marketOddsDecimal);
                        calculatedReturn = returnVal.toFixed(2);
                    }
                    
                    let participantsHtml = '';
                    const participants = marketNode.getElementsByTagName('Participant');
                    
                    if(participants.length === 0) continue;

                    for (let k = 0; k < participants.length; k++) {
                        const pName = participants[k].getAttribute('Name');
                        participantsHtml += `
                            <div class="selection-item">
                                <div class="check-icon">
                                    <svg viewBox="0 0 24 24">
                                        <polyline points="20 6 9 17 4 12"></polyline>
                                    </svg>
                                </div>
                                <span>${pName}</span>
                            </div>
                        `;
                    }

                    const cardHtml = `
                        <div class="bet-card">
                            <div class="card-content">
                                <div class="card-header">
                                    <h3 class="market-name">${marketName} +</h3>
                                    <div class="odds-container">
                                        ${marketUnBoosted ? `<span class="unboosted-odds">${marketUnBoosted}</span>` : ''}
                                        <span class="main-odds">${displayOdds}</span>
                                    </div>
                                </div>
                                <hr class="divider">
                                
                                <div class="event-name">${formattedName}</div>
                                
                                <div class="selections-list">
                                    ${participantsHtml}
                                </div>
                            </div>
                            
                            <div class="card-footer">
                                <div class="footer-col">
                                    <span class="footer-label">Stake</span>
                                    <span class="footer-val">£10.00</span>
                                </div>
                                <div class="footer-col right">
                                    <span class="footer-label">To Return</span>
                                    <span class="footer-val">£${calculatedReturn}</span>
                                </div>
                            </div>
                        </div>
                    `;

                    dashboard.innerHTML += cardHtml;
                    cardsRendered++;
                }
            }

            if (cardsRendered === 0) {
                dashboard.innerHTML = `<div class="no-results">No markets found for ${filterText}.</div>`;
            }
        }
    </script>
</body>
</html>
