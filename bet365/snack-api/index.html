<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premier League Odds Cards with Icons</title>
    <!-- Import fonts to match the design -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:ital,wght@1,700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* Grid for the cards */
        #cards-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            width: 100%;
            max-width: 1600px;
        }
        
        /* The Card Design */
        .promo-card {
            background: radial-gradient(circle, #25493b 0%, #162d23 100%);
            width: 480px;
            padding: 30px 20px;
            text-align: center;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border-radius: 8px;
            border: 1px solid #2a5242;
        }

        .match-title {
            color: #ffffff;
            font-size: 22px;
            letter-spacing: 1px;
            margin-bottom: 10px;
            font-style: normal;
        }

        .match-title .vs {
            color: #6df2a5;
            text-transform: lowercase;
            font-size: 18px;
            margin: 0 8px;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }

        .main-market {
            color: #ffffff;
            font-size: 40px;
            font-weight: 700;
            font-style: italic;
            line-height: 1.1;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }

        /* The section holding odds and icons */
        .odds-section {
            display: flex;
            justify-content: center; /* Center the group */
            align-items: center; /* Center vertically */
            gap: 20px; /* Space between all elements (odds and icons) */
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 15px 10px;
        }

        /* Specific icon style */
        .odds-icon {
            width: 35px;
            height: 35px;
            object-fit: contain;
            opacity: 0.8;
            filter: drop-shadow(0 0 10px rgba(109, 242, 165, 0.5));
            align-self: flex-end;
            margin-bottom: 5px;
        }

        .odd-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .odd-label {
            color: #9ba6a0;
            font-size: 16px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        .new-odds {
            color: #ffffff;
            font-size: 45px;
            font-weight: 700;
            font-style: italic;
            line-height: 1;
            text-shadow: 0 0 20px rgba(109, 242, 165, 0.4);
        }

        #status {
            color: #ffffff;
            font-size: 20px;
            text-align: center;
            width: 100%;
        }

        .error {
            color: #ff6b6b !important;
        }
    </style>
</head>
<body>

    <div id="status">Fetching Premier League Odds...</div>
    
    <div id="cards-container"></div>

    <script>
        const url = 'https://snack-feeds.b-cdn.net/bet365/feeds/premier-league.xml';
        
        // --- CHOOSE YOUR AMOUNT HERE ---
        const matchLimit = 3; 

        async function fetchAndParseXML() {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                
                const xmlText = await response.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, "text/xml");
                
                // Hide status message once data is loaded
                document.getElementById('status').style.display = 'none';
                
                generateCards(xmlDoc, matchLimit);
                
            } catch (error) {
                const statusDiv = document.getElementById('status');
                statusDiv.className = "error";
                statusDiv.innerHTML = `Error loading XML: ${error.message} <br><br>
                <span style="font-size: 14px;">(Check console for CORS errors if running locally.)</span>`;
            }
        }

        function generateCards(xmlDoc, limit) {
            const container = document.getElementById('cards-container');
            const events = xmlDoc.getElementsByTagName("Event"); 
            
            if (events.length === 0) {
                container.innerHTML = "<div style='color: white;'>No events found in the XML feed.</div>";
                return;
            }

            // Determine how many matches to loop through based on the limit
            const matchesToDisplay = Math.min(limit, events.length);

            for (let i = 0; i < matchesToDisplay; i++) {
                const eventNode = events[i];
                let eventName = eventNode.getAttribute("Name") || eventNode.getAttribute("name") || "Unknown Event";
                
                eventName = eventName.replace(/\s+v\s+/i, ' <span class="vs">v</span> ');
                
                const markets = eventNode.getElementsByTagName("Market");
                
                // Assuming we just want the first market (Match Winner) for the card
                if (markets.length > 0) {
                    const marketNode = markets[0]; 
                    const marketName = marketNode.getAttribute("Name") || marketNode.getAttribute("name") || "Match Winner";
                    
                    const participants = marketNode.getElementsByTagName("Participant");
                    
                    let homeOdds = "-", drawOdds = "-", awayOdds = "-";
                    let homeFound = false;
                    
                    for (let k = 0; k < participants.length; k++) {
                        const p = participants[k];
                        const pName = p.getAttribute("Name") || p.getAttribute("name") || "";
                        const pOdds = p.getAttribute("Odds") || p.getAttribute("odds") || "-";
                        
                        if (pName.toLowerCase() === "draw" || pName.toLowerCase() === "x") {
                            drawOdds = pOdds;
                        } else if (!homeFound) {
                            homeOdds = pOdds;
                            homeFound = true;
                        } else {
                            awayOdds = pOdds;
                        }
                    }

                    const card = document.createElement('div');
                    card.className = 'promo-card';
                    card.innerHTML = `
                        <div class="match-title">${eventName}</div>
                        <div class="main-market">${marketName}</div>
                        <div class="odds-section">
                            <div class="odd-container">
                                <div class="odd-label">HOME</div>
                                <div class="new-odds">${homeOdds}</div>
                            </div>
                            <img src="arrow.gif" class="odds-icon" /> <!-- Icon between Home and Draw -->
                            <div class="odd-container">
                                <div class="odd-label">DRAW</div>
                                <div class="new-odds">${drawOdds}</div>
                            </div>
                            <img src="arrow.gif" class="odds-icon" /> <!-- Icon between Draw and Away -->
                            <div class="odd-container">
                                <div class="odd-label">AWAY</div>
                                <div class="new-odds">${awayOdds}</div>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                }
            }
        }

        // Initialize script
        fetchAndParseXML();
    </script>
</body>
</html>
