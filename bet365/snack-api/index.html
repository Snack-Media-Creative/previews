<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premier League Odds Cards with Timer</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:ital,wght@1,700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        #cards-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            width: 100%;
            max-width: 1600px;
        }
        
        .promo-card {
            position: relative;
            background: radial-gradient(circle, #25493b 0%, #162d23 100%);
            width: 500px;  
            height: 300px; 
            box-sizing: border-box; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.85);
            border-radius: 8px;
            border: 1px solid #2a5242;
        }

        .promo-card::before,
        .promo-card::after {
            content: ">>";
            position: absolute;
            color: transparent;
            background-image: url(arrow.gif);
            background-size: contain;
            background-repeat: no-repeat;
            width: 50px;
            height: 50px;
        }

        .promo-card::before {
            top: -20px;
            left: 150px;
        }

        .promo-card::after {
            bottom: -35px;
            right: 100px;
        }

        .match-title {
            color: #ffffff;
            font-size: 32px;
            letter-spacing: 1px;
            margin-bottom: 5px;
            font-style: normal;
        }

        .match-title .vs {
            color: #6df2a5;
            text-transform: lowercase;
            font-size: 18px;
            margin: 0 8px;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }

        .timer-display {
            color: #6df2a5;
            font-size: 16px;
            font-family: Arial, sans-serif;
            margin-bottom: 15px; 
            letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.3);
            display: inline-block;
            padding: 5px 15px;
            border-radius: 4px;
        }

        .main-market {
            color: #ffffff;
            font-size: 30px;
            font-weight: 700;
            font-style: italic;
            line-height: 1.1;
            margin-bottom: 15px; 
            letter-spacing: 1px;
        }

        .odds-section {
            display: flex;
            justify-content: center; 
            align-items: center; 
            gap: 20px; 
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 12px 10px;
            width: 100%; 
            box-sizing: border-box;
        }

        .odds-icon {
            width: 35px;
            height: 35px;
            object-fit: contain;
            opacity: 0.8;
            filter: drop-shadow(0 0 10px rgba(109, 242, 165, 0.5));
            align-self: flex-end;
            margin-bottom: 5px;
        }

        .odd-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 110px; 
        }

        .odd-label {
            color: #9ba6a0;
            font-size: 14px; 
            font-family: Arial, sans-serif;
            font-weight: bold;
            margin-bottom: 5px;
            letter-spacing: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .new-odds {
            color: #ffffff;
            font-size: 30px;
            font-weight: 700;
            font-style: italic;
            line-height: 1;
            text-shadow: 0 0 20px rgba(109, 242, 165, 0.4);
        }

        #status {
            color: #ffffff;
            font-size: 20px;
            text-align: center;
            width: 100%;
        }

        .error {
            color: #ff6b6b !important;
        }

        /* --- Bet Builder Card Styles (Goalscorer) --- */
        .bet-builder-card {
            background: #1a2e24; 
            width: 500px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            padding: 20px 30px;
            font-family: 'Oswald', sans-serif;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid #2a5242;
        }

        .bb-main-title {
            text-align: center;
            font-size: 30px;
            letter-spacing: 1px;
            margin-bottom: 12px;
            text-transform: uppercase;
            font-weight: bold;
            font-style: italic;
        }

        .bb-main-title .white-text {
            color: #ffffff;
        }

        .bb-main-title .green-text {
            color: #6df2a5;
        }

        .bb-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #4a6659;
            padding-bottom: 10px;
            margin-bottom: 25px;
        }

        .bb-title {
            color: #ffffff;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .bb-title .vs {
            color: #6df2a5;
            text-transform: lowercase;
            font-size: 18px;
            margin: 0 6px;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }

        .bb-odds {
            color: #fce444; 
            font-size: 32px;
            font-weight: 700;
            font-style: italic;
        }

        .bb-list {
            display: flex;
            flex-direction: column;
            position: relative;
            padding-left: 15px; 
            gap: 25px; 
        }

        .bb-list::before {
            content: '';
            position: absolute;
            left: 28px; 
            top: 15px;
            bottom: 15px;
            width: 2px;
            background-color: #83958c;
            z-index: 1;
        }

        .bb-item {
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 2;
        }

        .bb-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid #83958c;
            background-color: #1a2e24;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bb-icon svg {
            width: 14px;
            height: 14px;
        }

        .bb-info {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .bb-name {
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            line-height: 1.1;
            margin-bottom: 3px;
        }
        
        .bb-player-odds {
            color: #fce444;
            margin-right: 8px;
        }

        .bb-market {
            color: #b0beb5;
            font-size: 14px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>
</head>
<body>

    <!-- Add this directly below <body> -->
    <div id="dropdown-container" style="text-align: center; margin-bottom: 20px;">
        <label for="team-selector" style="color: #6df2a5; font-size: 18px; font-family: 'Oswald', sans-serif; margin-right: 10px;">SELECT TEAM:</label>
        <select id="team-selector" style="padding: 10px; font-size: 16px; border-radius: 5px; background: #1a2e24; color: white; border: 1px solid #6df2a5; font-family: 'Oswald', sans-serif; cursor: pointer;">
            <option value="bournemouth">Bournemouth</option>
            <option value="everton">Everton</option>
            <option value="aston villa">Aston Villa</option>
            <option value="arsenal" selected>Arsenal</option>
            <option value="chelsea">Chelsea</option>
            <option value="brighton">Brighton</option>
            <option value="coventry">Coventry</option>
            <option value="hull">Hull</option>
            <option value="crystal palace">Crystal Palace</option>
            <option value="man city">Man City</option>
            <option value="leeds">Leeds</option>
            <option value="brentford">Brentford</option>
            <option value="liverpool">Liverpool</option>
            <option value="nottm forest">Nottm Forest</option>
            <option value="man utd">Man Utd</option>
            <option value="ipswich">Ipswich</option>
            <option value="sunderland">Sunderland</option>
            <option value="fulham">Fulham</option>
            <option value="tottenham">Tottenham</option>
            <option value="newcastle">Newcastle</option>
        </select>
    </div>
    
    <div id="status">Fetching Premier League Odds...</div>
    
    <div id="cards-container">
        <!-- Containers for the external scripts to target -->
        <div id="box1-container"></div>
        <div id="box2-container"></div>
        <div id="box3-container"></div>
    </div>

    <!-- External Scripts for Each Box -->
    <script src="box1.js"></script>
    <script src="box2.js"></script>
    <script src="box3.js"></script>
</body>
</html>
