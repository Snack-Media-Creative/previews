<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premier League Odds Cards with Timer</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:ital,wght@1,700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        #cards-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            width: 100%;
            max-width: 1600px;
        }
        
        .promo-card {
            position: relative;
            background: radial-gradient(circle, #25493b 0%, #162d23 100%);
            width: 500px;  
            height: 300px; 
            box-sizing: border-box; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border-radius: 8px;
            border: 1px solid #2a5242;
        }

        .promo-card::before,
        .promo-card::after {
            content: ">>";
            position: absolute;
            color: transparent;
            background-image: url(arrow.gif);
            background-size: contain;
            background-repeat: no-repeat;
            width: 50px;
            height: 50px;
        }

        .promo-card::before {
            top: -20px;
            left: 150px;
        }

        .promo-card::after {
            bottom: -35px;
            right: 100px;
        }

        .match-title {
            color: #ffffff;
            font-size: 22px;
            letter-spacing: 1px;
            margin-bottom: 5px;
            font-style: normal;
        }

        .match-title .vs {
            color: #6df2a5;
            text-transform: lowercase;
            font-size: 18px;
            margin: 0 8px;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }

        .timer-display {
            color: #6df2a5;
            font-size: 16px;
            font-family: Arial, sans-serif;
            margin-bottom: 15px; 
            letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.3);
            display: inline-block;
            padding: 5px 15px;
            border-radius: 4px;
        }

        .main-market {
            color: #ffffff;
            font-size: 40px;
            font-weight: 700;
            font-style: italic;
            line-height: 1.1;
            margin-bottom: 15px; 
            letter-spacing: 1px;
        }

        .odds-section {
            display: flex;
            justify-content: center; 
            align-items: center; 
            gap: 20px; 
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 12px 10px;
            width: 100%; 
            box-sizing: border-box;
        }

        .odds-icon {
            width: 35px;
            height: 35px;
            object-fit: contain;
            opacity: 0.8;
            filter: drop-shadow(0 0 10px rgba(109, 242, 165, 0.5));
            align-self: flex-end;
            margin-bottom: 5px;
        }

        .odd-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 110px; 
        }

        .odd-label {
            color: #9ba6a0;
            font-size: 14px; 
            font-family: Arial, sans-serif;
            font-weight: bold;
            margin-bottom: 5px;
            letter-spacing: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .new-odds {
            color: #ffffff;
            font-size: 45px;
            font-weight: 700;
            font-style: italic;
            line-height: 1;
            text-shadow: 0 0 20px rgba(109, 242, 165, 0.4);
        }

        #status {
            color: #ffffff;
            font-size: 20px;
            text-align: center;
            width: 100%;
        }

        .error {
            color: #ff6b6b !important;
        }

        /* --- Bet Builder Card Styles (Goalscorer) --- */
        .bet-builder-card {
            background: #1a2e24; 
            width: 500px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            padding: 20px 30px;
            font-family: 'Oswald', sans-serif;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border: 1px solid #2a5242;
        }

        .bb-main-title {
            text-align: left;
            font-size: 20px;
            letter-spacing: 1px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .bb-main-title .white-text {
            color: #ffffff;
        }

        .bb-main-title .green-text {
            color: #6df2a5;
        }

        .bb-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #4a6659;
            padding-bottom: 10px;
            margin-bottom: 25px;
        }

        .bb-title {
            color: #ffffff;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .bb-title .vs {
            color: #6df2a5;
            text-transform: lowercase;
            font-size: 18px;
            margin: 0 6px;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }

        .bb-odds {
            color: #fce444; 
            font-size: 32px;
            font-weight: 700;
            font-style: italic;
        }

        .bb-list {
            display: flex;
            flex-direction: column;
            position: relative;
            padding-left: 15px; 
            gap: 25px; 
        }

        .bb-list::before {
            content: '';
            position: absolute;
            left: 28px; 
            top: 15px;
            bottom: 15px;
            width: 2px;
            background-color: #83958c;
            z-index: 1;
        }

        .bb-item {
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 2;
        }

        .bb-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid #83958c;
            background-color: #1a2e24;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bb-icon svg {
            width: 14px;
            height: 14px;
        }

        .bb-info {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .bb-name {
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            text-transform: uppercase;
            line-height: 1.1;
            margin-bottom: 3px;
        }
        
        .bb-player-odds {
            color: #fce444;
            margin-right: 8px;
        }

        .bb-market {
            color: #b0beb5;
            font-size: 14px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
    </style>
</head>
<body>

    <div id="status">Fetching Premier League Odds...</div>
    
    <div id="cards-container"></div>

    <script>
        const feedConfigs = [
            { url: 'https://snack-feeds.b-cdn.net/bet365/feeds/premier-league.xml', type: 'match-winner' },
            { url: 'https://snack-feeds.b-cdn.net/bet365/feeds/premier-league-first-goalscorer.xml', type: 'goalscorer' },
            { url: 'https://snack-feeds.b-cdn.net/bet365/feeds/premier-league-first-goalscorer-subs.xml', type: 'goalscorer' }
        ];
        
        const matchLimit = 1; 

        async function initializeApp() {
            for (const config of feedConfigs) {
                await fetchAndParseXML(config.url, config.type);
            }
            startTimers();
        }

        async function fetchAndParseXML(url, feedType) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                
                const xmlText = await response.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, "text/xml");
                
                document.getElementById('status').style.display = 'none';
                
                generateCards(xmlDoc, matchLimit, feedType);
                
            } catch (error) {
                const statusDiv = document.getElementById('status');
                statusDiv.className = "error";
                statusDiv.style.display = 'block';
                statusDiv.innerHTML = `Error loading XML from ${url}: ${error.message} <br><br>
                <span style="font-size: 14px;">(Check console for CORS errors if running locally.)</span>`;
            }
        }

        function generateCards(xmlDoc, limit, feedType) {
            const container = document.getElementById('cards-container');
            const events = xmlDoc.getElementsByTagName("Event"); 
            
            if (events.length === 0) return;

            const matchesToDisplay = Math.min(limit, events.length);

            for (let i = 0; i < matchesToDisplay; i++) {
                const eventNode = events[i];
                let eventName = eventNode.getAttribute("Name") || eventNode.getAttribute("name") || "Unknown Event";
                const startTime = eventNode.getAttribute("StartTime");
                
                eventName = eventName.replace(/\s+v\s+/i, ' <span class="vs">v</span> ');
                
                const markets = eventNode.getElementsByTagName("Market");
                
                if (markets.length > 0) {
                    const marketNode = markets[0]; 
                    const marketName = marketNode.getAttribute("Name") || marketNode.getAttribute("name") || "Market";
                    
                    const participants = marketNode.getElementsByTagName("Participant");
                    
                    if (feedType === 'match-winner') {
                        let labels = ["HOME", "DRAW", "AWAY"];
                        let odds = ["-", "-", "-"];
                        
                        let homeFound = false;
                        for (let k = 0; k < participants.length; k++) {
                            const p = participants[k];
                            const pName = p.getAttribute("Name") || p.getAttribute("name") || "";
                            const pOdds = p.getAttribute("Odds") || p.getAttribute("odds") || "-";
                            
                            if (pName.toLowerCase() === "draw" || pName.toLowerCase() === "x") {
                                odds[1] = pOdds;
                            } else if (!homeFound) {
                                odds[0] = pOdds;
                                homeFound = true;
                            } else {
                                odds[2] = pOdds;
                            }
                        }

                        const card = document.createElement('div');
                        card.className = 'promo-card';
                        card.innerHTML = `
                            <div class="match-title">${eventName}</div>
                            <div class="timer-display" data-starttime="${startTime}">Loading timer...</div>
                            <div class="main-market">${marketName}</div>
                            <div class="odds-section">
                                <div class="odd-container">
                                    <div class="odd-label" title="${labels[0]}">${labels[0]}</div>
                                    <div class="new-odds">${odds[0]}</div>
                                </div>
                                <img src="arrow.gif" class="odds-icon" />
                                <div class="odd-container">
                                    <div class="odd-label" title="${labels[1]}">${labels[1]}</div>
                                    <div class="new-odds">${odds[1]}</div>
                                </div>
                                <img src="arrow.gif" class="odds-icon" />
                                <div class="odd-container">
                                    <div class="odd-label" title="${labels[2]}">${labels[2]}</div>
                                    <div class="new-odds">${odds[2]}</div>
                                </div>
                            </div>
                        `;
                        container.appendChild(card);

                    } else if (feedType === 'goalscorer') {
                        
                        let playersHtml = '';
                        let firstOdds = "-";
                        
                        if (participants.length > 0) {
                            firstOdds = participants[0].getAttribute("Odds") || participants[0].getAttribute("odds") || "-";
                        }

                        for (let k = 0; k < Math.min(7, participants.length); k++) {
                            const p = participants[k];
                            const pName = p.getAttribute("Name") || p.getAttribute("name") || `Player ${k+1}`;
                            const pOdds = p.getAttribute("Odds") || p.getAttribute("odds") || "-";
                            
                            playersHtml += `
                                <div class="bb-item">
                                    <div class="bb-icon">
                                        <svg viewBox="0 0 24 24" fill="none" stroke="#6df2a5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                    </div>
                                    <div class="bb-info">
                                        <div class="bb-name"><span class="bb-player-odds">${pOdds}</span>${pName}</div>
                                        <div class="bb-market">${marketName}</div>
                                    </div>
                                </div>
                            `;
                        }

                        const card = document.createElement('div');
                        card.className = 'bet-builder-card';
                        card.innerHTML = `
                            <div class="bb-main-title">
                                <span class="white-text">BET</span> <span class="green-text">BUILDER</span>
                            </div>
                            <div class="bb-header">
                                <div class="bb-title">${eventName}</div>
                            </div>
                            <div class="bb-list">
                                ${playersHtml}
                            </div>
                        `;
                        container.appendChild(card);
                    }
                }
            }
        }

        function startTimers() {
            setInterval(() => {
                document.querySelectorAll('.timer-display').forEach(timerEl => {
                    const timeStr = timerEl.getAttribute('data-starttime');
                    if (!timeStr) return;
                    
                    const [datePart, timePart] = timeStr.split(' ');
                    const [day, month, shortYear] = datePart.split('/');
                    const [hour, minute, second] = timePart.split(':');
                    const year = "20" + shortYear; 
                    
                    const eventDate = new Date(`${year}-${month}-${day}T${hour}:${minute}:${second}`);
                    const now = new Date();
                    const diff = eventDate - now;
                    
                    if (diff <= 0) {
                        timerEl.innerText = "Match Started";
                        timerEl.style.color = "#ff6b6b";
                    } else {
                        const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                        const h = Math.floor((diff / (1000 * 60 * 60)) % 24).toString().padStart(2, '0');
                        const m = Math.floor((diff / 1000 / 60) % 60).toString().padStart(2, '0');
                        const s = Math.floor((diff / 1000) % 60).toString().padStart(2, '0');
                        
                        const dayLabel = d === 1 ? 'Day' : 'Days';
                        
                        timerEl.innerText = `${d} ${dayLabel} ${h}:${m}:${s} to kick off`;
                    }
                });
            }, 1000);
        }

        initializeApp();
    </script>
</body>
</html>
