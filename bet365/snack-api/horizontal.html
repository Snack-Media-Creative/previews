<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premier League Odds Banner</title>
    <!-- Import fonts to match the design -->
    <link href="https://fonts.googleapis.com/css2?family=Oswald:ital,wght@1,700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: #0f1a14; /* Very dark background */
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        /* Container for all banners */
        #cards-container {
            display: flex;
            flex-direction: column; /* Stack them vertically */
            gap: 20px;
            width: 100%;
            max-width: 1000px; /* Wider max-width for horizontal layout */
        }
        
        /* The Horizontal Banner Design */
        .promo-banner {
            background-color: #1a3326; /* Dark green base */
            width: 100%;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            border-radius: 8px;
            box-sizing: border-box;
        }

        /* Left Side: Match and Market Info */
        .info-section {
            display: flex;
            flex-direction: column;
            align-items: flex-start; /* Left align text */
        }

        .match-title {
            color: #ffffff;
            font-size: 3vh;
            letter-spacing: 1.5px;
            margin-bottom: 5px;
            font-style: normal;
        }

        .match-title .vs {
            color: #6df2a5;
            text-transform: lowercase;
            font-size: 3vh;
            margin: 0 6px;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }

        .main-market {
            color: #ffffff;
            font-size: 2vh;
            font-weight: 700;
            font-style: italic;
            line-height: 1;
            letter-spacing: 1px;
        }

        /* Right Side: The Odds Box */
        .odds-box {
            display: flex;
            align-items: center; 
            gap: 25px; 
            background: #112219; /* Darker inset box */
            border-radius: 8px;
            padding: 15px 30px;
        }

        /* Specific icon style */
        .odds-icon {
            width: 30px;
            height: 30px;
            object-fit: contain;
            opacity: 0.9;
            align-self: flex-end; /* Push down to align with numbers */
            margin-bottom: 8px; /* Tweak to center perfectly with the large text */
        }

        .odd-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .odd-label {
            color: #9ba6a0;
            font-size: 1vh;
            font-family: Arial, sans-serif;
            font-weight: bold;
            margin-bottom: 5px;
            letter-spacing: 1.5px;
        }

        .new-odds {
            color: #ffffff;
            font-size: 3vh;
            font-weight: 700;
            font-style: italic;
            line-height: 1;
        }

        #status {
            color: #ffffff;
            font-size: 20px;
            text-align: center;
            width: 100%;
        }

        .error {
            color: #ff6b6b !important;
        }
    </style>
</head>
<body>

    <div id="status">Fetching Premier League Odds...</div>
    
    <div id="cards-container"></div>

    <script>
        const url = 'https://snack-feeds.b-cdn.net/bet365/feeds/premier-league.xml';
        
        // --- CHOOSE YOUR AMOUNT HERE ---
        const matchLimit = 1; 

        async function fetchAndParseXML() {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                
                const xmlText = await response.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, "text/xml");
                
                document.getElementById('status').style.display = 'none';
                
                generateBanners(xmlDoc, matchLimit);
                
            } catch (error) {
                const statusDiv = document.getElementById('status');
                statusDiv.className = "error";
                statusDiv.innerHTML = `Error loading XML: ${error.message}`;
            }
        }

        function generateBanners(xmlDoc, limit) {
            const container = document.getElementById('cards-container');
            const events = xmlDoc.getElementsByTagName("Event"); 
            
            if (events.length === 0) {
                container.innerHTML = "<div style='color: white;'>No events found in the XML feed.</div>";
                return;
            }

            const matchesToDisplay = Math.min(limit, events.length);

            for (let i = 0; i < matchesToDisplay; i++) {
                const eventNode = events[i];
                let eventName = eventNode.getAttribute("Name") || eventNode.getAttribute("name") || "Unknown Event";
                
                eventName = eventName.replace(/\s+v\s+/i, ' <span class="vs">v</span> ');
                
                const markets = eventNode.getElementsByTagName("Market");
                
                if (markets.length > 0) {
                    const marketNode = markets[0]; 
                    const marketName = marketNode.getAttribute("Name") || marketNode.getAttribute("name") || "Full Time Result";
                    
                    const participants = marketNode.getElementsByTagName("Participant");
                    
                    let homeOdds = "-", drawOdds = "-", awayOdds = "-";
                    let homeFound = false;
                    
                    for (let k = 0; k < participants.length; k++) {
                        const p = participants[k];
                        const pName = p.getAttribute("Name") || p.getAttribute("name") || "";
                        const pOdds = p.getAttribute("Odds") || p.getAttribute("odds") || "-";
                        
                        if (pName.toLowerCase() === "draw" || pName.toLowerCase() === "x") {
                            drawOdds = pOdds;
                        } else if (!homeFound) {
                            homeOdds = pOdds;
                            homeFound = true;
                        } else {
                            awayOdds = pOdds;
                        }
                    }

                    const banner = document.createElement('div');
                    banner.className = 'promo-banner';
                    banner.innerHTML = `
                        <div class="info-section">
                            <div class="match-title">${eventName}</div>
                            <div class="main-market">${marketName}</div>
                        </div>
                        <div class="odds-box">
                            <div class="odd-container">
                                <div class="odd-label">HOME</div>
                                <div class="new-odds">${homeOdds}</div>
                            </div>
                            <img src="arrow.gif" class="odds-icon" />
                            <div class="odd-container">
                                <div class="odd-label">DRAW</div>
                                <div class="new-odds">${drawOdds}</div>
                            </div>
                            <img src="arrow.gif" class="odds-icon" />
                            <div class="odd-container">
                                <div class="odd-label">AWAY</div>
                                <div class="new-odds">${awayOdds}</div>
                            </div>
                        </div>
                    `;
                    container.appendChild(banner);
                }
            }
        }

        // Initialize script
        fetchAndParseXML();
    </script>
</body>
</html>
