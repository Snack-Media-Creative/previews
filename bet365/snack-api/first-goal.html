<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premier League Odds Cards with Timer</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:ital,wght@1,700&display=swap" rel="stylesheet">
    
    <style>
        /* Base styles retained from original template[cite: 2] */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 40px 20px;
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        #cards-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            width: 100%;
            max-width: 1600px;
        }
        
        .promo-card {
            position: relative; 
            background: radial-gradient(circle, #25493b 0%, #162d23 100%);
            width: 500px;  
            height: 300px; 
            box-sizing: border-box; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            border-radius: 8px;
            border: 1px solid #2a5242;
        }

        .promo-card::before,
        .promo-card::after {
            content: ">>";
            position: absolute;
            color: transparent;
            background-image: url(arrow.gif);
            background-size: contain;
            background-repeat: no-repeat;
            width: 50px;
            height: 50px;
        }

        .promo-card::before {
            top: -20px;
            left: 150px;
        }

        .promo-card::after {
            bottom: -35px;
            right: 100px;
        }

        .match-title {
            color: #ffffff;
            font-size: 22px;
            letter-spacing: 1px;
            margin-bottom: 5px;
            font-style: normal;
        }

        .match-title .vs {
            color: #6df2a5;
            text-transform: lowercase;
            font-size: 18px;
            margin: 0 8px;
            font-family: Arial, sans-serif;
            font-weight: bold;
        }

        .timer-display {
            color: #6df2a5;
            font-size: 16px;
            font-family: Arial, sans-serif;
            margin-bottom: 15px; 
            letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.3);
            display: inline-block;
            padding: 5px 15px;
            border-radius: 4px;
        }

        .main-market {
            color: #ffffff;
            font-size: 40px;
            font-weight: 700;
            font-style: italic;
            line-height: 1.1;
            margin-bottom: 15px; 
            letter-spacing: 1px;
        }

        .odds-section {
            display: flex;
            justify-content: center; 
            align-items: center; 
            gap: 20px; 
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            padding: 12px 10px;
            width: 100%; 
            box-sizing: border-box;
        }

        .odds-icon {
            width: 35px;
            height: 35px;
            object-fit: contain;
            opacity: 0.8;
            filter: drop-shadow(0 0 10px rgba(109, 242, 165, 0.5));
            align-self: flex-end;
            margin-bottom: 5px;
        }

        .odd-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1; /* Ensures player names have equal spacing */
        }

        /* Adjusted label font size to accommodate longer player names */
        .odd-label {
            color: #9ba6a0;
            font-size: 13px; 
            font-family: Arial, sans-serif;
            font-weight: bold;
            margin-bottom: 5px;
            letter-spacing: 1px;
            text-align: center;
        }

        .new-odds {
            color: #ffffff;
            font-size: 45px;
            font-weight: 700;
            font-style: italic;
            line-height: 1;
            text-shadow: 0 0 20px rgba(109, 242, 165, 0.4);
        }

        #status {
            color: #ffffff;
            font-size: 20px;
            text-align: center;
            width: 100%;
        }

        .error {
            color: #ff6b6b !important;
        }
    </style>
</head>
<body>

    <div id="status" style="display: none;">Fetching Premier League Odds...</div>
    
    <div id="cards-container">
        <!-- Manually injected content from the first event in data-first-goal.xml[cite: 1] -->
        <div class="promo-card">
            <div class="match-title">Bournemouth <span class="vs">v</span> Everton</div> <!--[cite: 1, 2] -->
            <div class="timer-display" data-starttime="29/08/26 15:00:00">Loading timer...</div> <!--[cite: 1, 2] -->
            <div class="main-market">First Goalscorer</div> <!--[cite: 1] -->
            <div class="odds-section">
                <!-- Participant 1: Evanilson[cite: 1] -->
                <div class="odd-container">
                    <div class="odd-label">EVANILSON</div>
                    <div class="new-odds">9/2</div>
                </div>
                <img src="arrow.gif" class="odds-icon" /> <!--[cite: 2] -->
                <!-- Participant 2: Rayan Vitor[cite: 1] -->
                <div class="odd-container">
                    <div class="odd-label">RAYAN VITOR</div>
                    <div class="new-odds">6/1</div>
                </div>
                <img src="arrow.gif" class="odds-icon" /> <!--[cite: 2] -->
                <!-- Participant 3: Daniel Jebbison[cite: 1] -->
                <div class="odd-container">
                    <div class="odd-label">DANIEL JEBBISON</div>
                    <div class="new-odds">13/2</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Data path updated to target the First Goalscorer XML feed[cite: 1]
        const url = 'data-first-goal.xml'; 
        const matchLimit = 1; 

        async function fetchAndParseXML() {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP error! Status: ${response.status}`);
                
                const xmlText = await response.text();
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlText, "text/xml");
                
                document.getElementById('status').style.display = 'none';
                
                generateCards(xmlDoc, matchLimit);
                startTimers();
                
            } catch (error) {
                const statusDiv = document.getElementById('status');
                statusDiv.className = "error";
                statusDiv.innerHTML = `Error loading XML: ${error.message} <br><br>
                <span style="font-size: 14px;">(Check console for CORS errors if running locally.)</span>`;
            }
        }

        function generateCards(xmlDoc, limit) {
            const container = document.getElementById('cards-container');
            const events = xmlDoc.getElementsByTagName("Event"); 
            
            if (events.length === 0) return;

            // Clear static HTML placeholder before rendering
            container.innerHTML = ""; 

            const matchesToDisplay = Math.min(limit, events.length);

            for (let i = 0; i < matchesToDisplay; i++) {
                const eventNode = events[i];
                let eventName = eventNode.getAttribute("Name") || eventNode.getAttribute("name") || "Unknown Event";
                const startTime = eventNode.getAttribute("StartTime");
                
                eventName = eventName.replace(/\s+v\s+/i, ' <span class="vs">v</span> '); //[cite: 2]
                
                const markets = eventNode.getElementsByTagName("Market");
                
                if (markets.length > 0) {
                    const marketNode = markets[0]; 
                    const marketName = marketNode.getAttribute("Name") || marketNode.getAttribute("name"); //[cite: 1]
                    
                    const participants = marketNode.getElementsByTagName("Participant");
                    
                    // Logic updated to pull the top 3 goalscorers instead of Home/Draw/Away[cite: 1, 2]
                    const p1Name = participants[0] ? participants[0].getAttribute("Name").trim() : "-";
                    const p1Odds = participants[0] ? participants[0].getAttribute("Odds") : "-";
                    
                    const p2Name = participants[1] ? participants[1].getAttribute("Name").trim() : "-";
                    const p2Odds = participants[1] ? participants[1].getAttribute("Odds") : "-";
                    
                    const p3Name = participants[2] ? participants[2].getAttribute("Name").trim() : "-";
                    const p3Odds = participants[2] ? participants[2].getAttribute("Odds") : "-";

                    const card = document.createElement('div');
                    card.className = 'promo-card';
                    card.innerHTML = `
                        <div class="match-title">${eventName}</div>
                        <div class="timer-display" data-starttime="${startTime}">Loading timer...</div>
                        <div class="main-market">${marketName}</div>
                        <div class="odds-section">
                            <div class="odd-container">
                                <div class="odd-label">${p1Name.toUpperCase()}</div>
                                <div class="new-odds">${p1Odds}</div>
                            </div>
                            <img src="arrow.gif" class="odds-icon" />
                            <div class="odd-container">
                                <div class="odd-label">${p2Name.toUpperCase()}</div>
                                <div class="new-odds">${p2Odds}</div>
                            </div>
                            <img src="arrow.gif" class="odds-icon" />
                            <div class="odd-container">
                                <div class="odd-label">${p3Name.toUpperCase()}</div>
                                <div class="new-odds">${p3Odds}</div>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                }
            }
        }

        function startTimers() {
            setInterval(() => {
                document.querySelectorAll('.timer-display').forEach(timerEl => {
                    const timeStr = timerEl.getAttribute('data-starttime');
                    if (!timeStr) return;
                    
                    const [datePart, timePart] = timeStr.split(' ');
                    const [day, month, shortYear] = datePart.split('/');
                    const [hour, minute, second] = timePart.split(':');
                    const year = "20" + shortYear; 
                    
                    const eventDate = new Date(`${year}-${month}-${day}T${hour}:${minute}:${second}`);
                    const now = new Date();
                    const diff = eventDate - now;
                    
                    if (diff <= 0) {
                        timerEl.innerText = "Match Started";
                        timerEl.style.color = "#ff6b6b";
                    } else {
                        const d = Math.floor(diff / (1000 * 60 * 60 * 24));
                        const h = Math.floor((diff / (1000 * 60 * 60)) % 24).toString().padStart(2, '0');
                        const m = Math.floor((diff / 1000 / 60) % 60).toString().padStart(2, '0');
                        const s = Math.floor((diff / 1000) % 60).toString().padStart(2, '0');
                        
                        const dayLabel = d === 1 ? 'Day' : 'Days';
                        
                        timerEl.innerText = `${d} ${dayLabel} ${h}:${m}:${s} to kick off`;
                    }
                });
            }, 1000); //[cite: 2]
        }

        // Uncomment the line below to allow the script to override the hardcoded HTML using a live local XML feed.
        // fetchAndParseXML(); 
        startTimers(); // Start the timer for the hardcoded fallback event immediately
    </script>
</body>
</html>
