<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wireframe Preview</title>
    <style>
        /* Base Wireframe Styles */
        :root {
            --wf-border: 2px solid #333;
            --wf-bg: #f9f9f9;
            --wf-placeholder: #e0e0e0;
            --wf-text: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Courier New', Courier, monospace; /* Monospace font gives a blueprint/draft feel */
            background-color: #fff;
            color: var(--wf-text);
            line-height: 1.6;
            padding: 20px;
        }

        /* Layout Container */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 3fr 1fr;
            grid-gap: 20px;
        }

        /* Generic Box Styling */
        .box {
            border: var(--wf-border);
            background-color: var(--wf-bg);
            padding: 20px;
        }

        /* Header */
        header {
            grid-column: 1 / -1;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-placeholder {
            width: 150px;
            height: 50px;
            background-color: var(--wf-placeholder);
            border: var(--wf-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 15px;
        }

        nav ul li {
            width: 80px;
            height: 30px;
            background-color: var(--wf-placeholder);
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
        }

        /* Hero Section */
        .hero {
            grid-column: 1 / -1;
            height: 250px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            /* Creates the classic wireframe crossed-box look for images */
            background: 
                linear-gradient(to top left, transparent calc(50% - 1px), #ccc calc(50% - 1px), #ccc calc(50% + 1px), transparent calc(50% + 1px)),
                linear-gradient(to top right, transparent calc(50% - 1px), #ccc calc(50% - 1px), #ccc calc(50% + 1px), transparent calc(50% + 1px));
            background-color: var(--wf-bg);
        }

        .hero h1 {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 10px 20px;
            border: var(--wf-border);
            margin-bottom: 10px;
        }

        /* Main Content */
        main {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .article-block {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .image-placeholder {
            width: 100%;
            height: 150px;
            background-color: var(--wf-placeholder);
            border: var(--wf-border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777;
        }

        .text-line {
            height: 15px;
            background-color: var(--wf-placeholder);
            border-radius: 2px;
        }

        .text-line.short { width: 60%; }
        .text-line.medium { width: 85%; }
        .text-line.long { width: 100%; }

        /* Sidebar */
        aside {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .widget {
            min-height: 150px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* Footer */
        footer {
            grid-column: 1 / -1;
            text-align: center;
            margin-top: 20px;
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Header & Navigation -->
        <header class="box">
            <div class="logo-placeholder"></div>
            <nav>
                <ul>
                    <li>Nav 1</li>

        </header>

        <!-- Hero / Banner Section -->
        <div class="box hero">

        <!-- Main Content Area -->
        <main>
            <div class="box article-block">

                <h2></h2>

        </main>

        <!-- Sidebar -->
        <aside>
            <div class="box widget">
                <h3></h3>
                <div class="image-placeholder" style="height: 100px;"></div>
                <div class="text-line long"></div>
                <div class="text-line short"></div>
            </div>

            <div class="box widget">
                <h3></h3>
                <div class="text-line medium"></div>
                <div class="text-line medium"></div>
                <div class="text-line medium"></div>
                <div class="text-line medium"></div>
            </div>            <div class="box widget">
                <h3></h3>
                <div class="image-placeholder" style="height: 100px;"></div>
                <div class="text-line long"></div>
                <div class="text-line short"></div>
            </div>

            <div class="box widget">
                <h3></h3>
                <div class="text-line medium"></div>
                <div class="text-line medium"></div>
                <div class="text-line medium"></div>
                <div class="text-line medium"></div>
            </div>
        </aside>

        <!-- Footer -->
        <footer class="box">
            <p></p>
        </footer>

    </div>
