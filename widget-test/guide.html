<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Golf Clubs Preview Widget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@600;700;800&family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0B1D40;
    --navy-dark:#071530;
    --cyan:#17EDFF;
    --cyan-deep:#00AFC2;
    --white:#FFFFFF;
    --grey-bg:#F2F4F7;
    --grey-line:#E2E6ED;
    --text-muted:#6B7280;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    font-family:'Nunito Sans',sans-serif;
    color:var(--navy);
    -webkit-font-smoothing:antialiased;
  }
  body{
    background:linear-gradient(180deg, #FFFFFF 0%, #F5F6F8 100%);
    position:relative;
    overflow-x:hidden;
  }
  h1,h2,.serif{ font-family:'Bodoni Moda',serif; }

  /* ---------------- HOLDING SLIDE BACKGROUND ---------------- */
  .holding-banner{
    background:#EDEDED; color:#8A8A8A; text-align:center; padding:9px 12px;
    font-size:11.5px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase;
    border-bottom:1px solid #DCDCDC;
  }
  .page-mock{
    max-width:1100px;
    margin:0 auto;
    padding:0 0 300px;
  }
  .gs-nav{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 32px;
    border-bottom:1px solid var(--grey-line);
  }
  .gs-nav .gs-logo-ph{ width:120px; height:22px; background:#D9D9D9; border-radius:4px; }
  .gs-nav .gs-links{display:flex; gap:14px;}
  .gs-nav .gs-links span{ display:block; width:58px; height:10px; background:#DDDDDD; border-radius:4px; }
  .gs-nav .gs-links span:nth-child(2){width:70px;}
  .gs-nav .gs-links span:nth-child(4){width:46px;}
  @media (max-width:900px){ .gs-nav .gs-links{display:none;} }
  .gs-nav .gs-right-ph{ width:64px; height:14px; background:#DDDDDD; border-radius:999px; }

  .gs-hero{
    width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    background:#E7E7E7; height:260px; position:relative; overflow:hidden; text-align:center;
  }
  .gs-hero .hero-label{ font-family:'Nunito Sans',sans-serif; font-size:22px; font-weight:700; color:#A6A6A6; letter-spacing:0.08em; }
  .gs-hero .hero-sub{ margin-top:8px; font-size:13px; color:#B4B4B4; max-width:360px; }

  .gs-intro{ max-width:1040px; margin:26px auto 0; padding:0 32px; }
  .gs-intro-card{ background:#F2F2F2; border:1px solid var(--grey-line); border-radius:14px; padding:26px 30px; }
  .gs-intro-card .ph-line{ background:#DADADA; border-radius:4px; height:12px; margin-bottom:10px; }
  .gs-intro-card .ph-line.w90{width:90%;}
  .gs-intro-card .ph-line.w75{width:75%;}
  .gs-intro-card .ph-btn{ width:150px; height:16px; background:#CFCFCF; border-radius:999px; margin-top:14px; }

  /* ---------------- LAUNCHER ---------------- */
  .launcher{
    position:fixed;
    left:24px;
    bottom:80px;
    z-index:1000;
    display:flex;
    flex-direction:row;
    align-items:center;
    gap:12px;
    background:linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
    border:none;
    border-radius:999px;
    padding:9px 22px 9px 16px;
    cursor:pointer;
    box-shadow:0 14px 30px -10px rgba(11,29,64,0.55);
    transition:transform .2s cubic-bezier(.34,1.56,.64,1), box-shadow .2s ease;
    animation:pop-in .5s ease .2s both;
  }
  .launcher:hover{
    transform:translateY(-4px) scale(1.035);
    box-shadow:0 20px 42px -8px rgba(23,237,255,0.35), 0 0 0 2px var(--cyan);
  }
  .launcher:active{transform:translateY(-1px) scale(1.01); transition-duration:.08s;}
  .launcher-logo{ display:flex; align-items:center; justify-content:center; transition:transform .2s ease; }
  .launcher:hover .launcher-logo{transform:scale(1.05);}
  .launcher .label{display:flex; flex-direction:column; line-height:1.2; text-align:left;}
  .launcher .label .l1{font-size:13.5px; font-weight:700; color:var(--white);}
  .launcher .label .l2{font-size:10.5px; font-weight:600; color:var(--cyan);}
  .launcher.hidden{display:none;}
  @keyframes pop-in{ from{opacity:0; transform:translateY(14px) scale(0.94);} to{opacity:1; transform:translateY(0) scale(1);} }

  /* ---------------- PANEL ---------------- */
  .widget-panel{
    position:fixed;
    left:24px;
    bottom:80px;
    z-index:1001;
    width:430px;
    max-width:calc(100vw - 32px);
    height:680px;
    max-height:calc(100vh - 104px);
    background:var(--white);
    border-radius:18px;
    box-shadow:0 30px 70px -20px rgba(11,29,64,0.5);
    display:none;
    flex-direction:column;
    overflow:hidden;
    transform-origin:bottom left;
  }
  .widget-panel.open{ display:flex; animation:expand-in .32s cubic-bezier(.2,.9,.25,1) both; }
  @keyframes expand-in{ from{opacity:0; transform:scale(0.85) translateY(16px);} to{opacity:1; transform:scale(1) translateY(0);} }

  .panel-header{
    position:relative;
    background:linear-gradient(150deg, var(--navy) 45%, var(--navy-dark) 100%);
    padding:18px 20px 18px;
    flex-shrink:0;
    overflow:hidden;
  }
  .panel-header::before{
    content:"";
    position:absolute; top:-50%; right:-25%;
    width:70%; height:200%;
    background:var(--cyan);
    opacity:0.12;
    border-radius:50%;
  }
  .panel-header::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0; height:3px;
    background:linear-gradient(90deg, var(--navy), var(--cyan));
  }
  .header-top{
    position:relative; z-index:2;
    display:flex; align-items:center; justify-content:space-between;
  }
  .header-title-group {
    display:flex; align-items:center; gap:12px;
  }
  .brand-logo {
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .header-text {
    display:flex; flex-direction:column;
  }
  .header-actions{display:flex; gap:6px; margin-left:auto;}
  .header-actions button{
    width:28px; height:28px; border-radius:8px; border:none;
    background:rgba(255,255,255,0.12); color:var(--white);
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    transition:background .15s ease;
  }
  .header-actions button:hover{background:rgba(255,255,255,0.24);}
  .header-actions svg{width:13px; height:13px;}
  .panel-header h2{
    position:relative; z-index:2;
    color:var(--white);
    font-size:19px; font-weight:700; line-height:1.28;
    margin:0 0 2px;
  }
  .panel-header .h2-sub{
    position:relative; z-index:2;
    color:rgba(255,255,255,0.65);
    font-size:11.5px; font-weight:500;
  }

  /* View toggle */
  .view-toggle{
    position:relative; z-index:2;
    display:flex; gap:6px; margin-top:14px;
  }
  .view-toggle button{
    flex:1; border:none; border-radius:999px; padding:8px 0;
    font-size:11px; font-weight:700; cursor:pointer;
    background:rgba(255,255,255,0.12); color:rgba(255,255,255,0.8);
    transition:background .15s ease, color .15s ease;
  }
  .view-toggle button.active{ background:var(--cyan); color:var(--navy); }

  /* Body */
  .panel-body{ flex:1; overflow-y:auto; padding:16px 18px 18px; }
  .panel-body::-webkit-scrollbar{width:6px;}
  .panel-body::-webkit-scrollbar-thumb{background:#DDD; border-radius:10px;}

  /* Search */
  .search-container { margin-bottom: 16px; }
  .search-input {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--grey-line);
    border-radius: 10px;
    font-size: 13px;
    font-family: 'Nunito Sans', sans-serif;
    color: var(--navy);
    background: var(--white);
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .search-input:focus {
    outline: none;
    border-color: var(--cyan-deep);
    box-shadow: 0 0 0 3px rgba(23,237,255,0.14);
  }
  .search-input::placeholder { color: var(--text-muted); font-weight: 500; }
  .no-results {
    text-align: center; padding: 24px; font-size: 13px; color: var(--text-muted); font-weight: 600;
  }

  /* Club List */
  .club-list {
    display: grid;
    gap: 12px;
    animation:fade-up .3s ease both;
  }
  .club-list.cols-1 { grid-template-columns: 1fr; }
  .club-list.cols-2 { grid-template-columns: 1fr 1fr; }

  @keyframes fade-up{ from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }
  
  .club-card {
    border: 1px solid var(--grey-line); 
    border-radius: 12px;
    transition: box-shadow .15s ease, border-color .15s ease;
    display: flex; 
    overflow: hidden;
    background: var(--white);
  }
  .club-card:hover { box-shadow: 0 12px 26px -16px rgba(11,29,64,0.3); border-color: #cfd6e0; }
  
  /* 1 Column View Layout */
  .club-list.cols-1 .club-card {
    flex-direction: row;
    align-items: stretch;
  }
  .club-list.cols-1 .club-card img {
    width: 140px;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    flex-shrink: 0;
  }

  /* 2 Columns View Layout */
  .club-list.cols-2 .club-card {
    flex-direction: column;
  }
  .club-list.cols-2 .club-card img {
    width: 100%; 
    height: 120px; 
    object-fit: cover;
  }
  
  .club-card .info { 
    padding: 13px 14px; 
    flex: 1; 
    display: flex; 
    flex-direction: column; 
    justify-content: space-between; 
    min-width: 0; /* Prevents text overflowing flex boundaries */
  }
  .club-card .pc-name { font-size: 14.5px; font-weight: 800; color: var(--navy); line-height: 1.3; }
  .club-card .pc-meta { font-size: 11px; color: var(--navy); font-weight: 700; margin-top: 4px; }
  .club-card .pc-desc { font-size: 12px; color: var(--text-muted); margin-top: 6px; line-height: 1.4; }
  
  /* Tags */
  .club-tags { display:flex; flex-wrap:wrap; gap:4px; margin-top:10px; }
  .club-tag {
    font-size:9.5px; font-weight:800; color:var(--cyan-deep);
    background:#E6FCFF; padding:3px 6px; border-radius:4px;
    text-transform:uppercase; letter-spacing:0.04em;
  }
  
  .view-btn {
    width: 100%; margin-top: 14px; border: none; border-radius: 8px; height: 36px;
    background: var(--navy); color: var(--white); font-weight: 800; font-size: 12.5px;
    cursor: pointer; transition: background .15s ease;
  }
  .view-btn:hover { background: var(--navy-dark); }

  @media (max-width:460px){
    .widget-panel{ width:calc(100vw - 24px); left:12px; bottom:68px; height:calc(100vh - 92px); }
    .launcher{ left:12px; bottom:68px; }
  }

</style>
</head>
<body>

<button class="launcher" id="launcherBtn">
  <div class="launcher-logo">
    <svg viewBox="0 0 32 32" width="28" height="28" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="16" cy="16" r="14" stroke="#17EDFF" stroke-width="2.5" stroke-dasharray="4 4"/>
      <path d="M12 21L16 13L20 21" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="16" cy="9" r="3" fill="#17EDFF"/>
    </svg>
  </div>
  <span class="label">
    <span class="l1">Explore Golf Clubs</span>
    <span class="l2">View venues & details</span>
  </span>
</button>

<div class="widget-panel" id="widgetPanel">
  <div class="panel-header">
    <div class="header-top">
      <div class="header-title-group">
        <div class="brand-logo">
          <svg viewBox="0 0 32 32" width="34" height="34" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="16" cy="16" r="14" stroke="#17EDFF" stroke-width="2.5" stroke-dasharray="4 4"/>
            <path d="M12 21L16 13L20 21" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="16" cy="9" r="3" fill="#17EDFF"/>
          </svg>
        </div>
        <div class="header-text">
          <h2>Featured Golf Clubs</h2>
          <div class="h2-sub">Browse top destinations</div>
        </div>
      </div>
      <div class="header-actions">
        <button id="minimizeBtn" title="Minimize">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 12h14" stroke="white" stroke-width="2.2" stroke-linecap="round"/></svg>
        </button>
      </div>
    </div>
    <div class="view-toggle" id="colToggle">
      <button type="button" class="active" data-col="1">1 Column</button>
      <button type="button" data-col="2">2 Columns</button>
    </div>
  </div>

  <div class="panel-body" id="panelBody">
    <div class="search-container">
      <input type="text" id="searchInput" class="search-input" placeholder="Search by name, location, or tag..." autocomplete="off">
    </div>
    <div class="club-list cols-1" id="clubList">
      <!-- Injected via JS -->
    </div>
  </div>
</div>

<script>
// Mock data for Golf Clubs
const clubs = [
  { 
    name: "St Andrews Links", 
    location: "Fife, Scotland", 
    description: "The historic home of golf with iconic courses, coastal views, and legendary heritage spanning centuries.",
    tags: ["restaurant", "bar", "caddie"],
    img: "https://images.unsplash.com/photo-1593111774240-d529f12eb4a6?auto=format&fit=crop&w=400&q=80" 
  },
  { 
    name: "Royal Lytham & St Annes", 
    location: "Lancashire, England", 
    description: "A premier links course renowned for its challenging bunkers and historic Victorian clubhouse.",
    tags: ["clubhouse", "pro shop", "bar"],
    img: "https://images.unsplash.com/photo-1587174486073-ae5e5cff23aa?auto=format&fit=crop&w=400&q=80" 
  },
  { 
    name: "Pebble Beach Golf Links", 
    location: "California, USA", 
    description: "Experience stunning oceanfront views and world-class championship golf on the California coast.",
    tags: ["spa", "resort", "restaurant"],
    img: "https://images.unsplash.com/photo-1535136125442-5cb82bc26581?auto=format&fit=crop&w=400&q=80" 
  },
  { 
    name: "Augusta National", 
    location: "Georgia, USA", 
    description: "Exclusive, pristine grounds famous for hosting The Masters and featuring impeccable landscaping.",
    tags: ["private", "caddie", "dining"],
    img: "https://images.unsplash.com/photo-1570535307374-e85d43fb6bd6?auto=format&fit=crop&w=400&q=80" 
  },
  { 
    name: "Pinehurst Resort", 
    location: "North Carolina, USA", 
    description: "A historic golf resort offering multiple legendary courses, luxurious amenities, and classic Southern charm.",
    tags: ["pool", "spa", "restaurant"],
    img: "https://images.unsplash.com/photo-1629836935987-5c4d4400490f?auto=format&fit=crop&w=400&q=80" 
  }
];

const clubList = document.getElementById('clubList');
const searchInput = document.getElementById('searchInput');

// Render the clubs based on a provided array
function renderClubs(clubsToRender) {
  if (clubsToRender.length === 0) {
    clubList.innerHTML = `<div class="no-results">No venues match your search.</div>`;
    return;
  }
  
  clubList.innerHTML = clubsToRender.map(c => `
    <div class="club-card">
      <img src="${c.img}" alt="${c.name}">
      <div class="info">
        <div>
          <div class="pc-name">${c.name}</div>
          <div class="pc-meta">${c.location}</div>
          <div class="pc-desc">${c.description}</div>
          <div class="club-tags">
            ${c.tags.map(t => `<span class="club-tag">${t}</span>`).join('')}
          </div>
        </div>
        <button class="view-btn">View Club</button>
      </div>
    </div>
  `).join('');
}

// Initial render
renderClubs(clubs);

// Search functionality
searchInput.addEventListener('input', function(e) {
  const term = e.target.value.toLowerCase().trim();
  
  const filteredClubs = clubs.filter(c => {
    return c.name.toLowerCase().includes(term) ||
           c.location.toLowerCase().includes(term) ||
           c.description.toLowerCase().includes(term) ||
           c.tags.some(t => t.toLowerCase().includes(term));
  });
  
  renderClubs(filteredClubs);
});

// Column toggle functionality
document.getElementById('colToggle').addEventListener('click', function(e) {
  const btn = e.target.closest('button');
  if(!btn) return;
  
  // Update active state
  this.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  
  // Update grid layout class
  clubList.className = `club-list cols-${btn.dataset.col}`;
});

// Launcher / panel open-close logic
const launcherBtn = document.getElementById('launcherBtn');
const widgetPanel = document.getElementById('widgetPanel');

document.getElementById('minimizeBtn').addEventListener('click', () => {
  widgetPanel.classList.remove('open');
  launcherBtn.classList.remove('hidden');
});

launcherBtn.addEventListener('click', () => {
  widgetPanel.classList.add('open');
  launcherBtn.classList.add('hidden');
  // Optional: Focus the search input when opening the widget
  setTimeout(() => searchInput.focus(), 300);
});
</script>

</body>
</html>
